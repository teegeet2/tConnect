<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TConnect</title>
<link href="https://fonts.googleapis.com/css2?family=gg+Sans:wght@400;500;600;700&family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
--bg-primary:#313338;
--bg-secondary:#2b2d31;
--bg-tertiary:#1e1f22;
--bg-quaternary:#232428;
--bg-hover:#35373c;
--bg-active:#404249;
--bg-modifier-hover:rgba(79,84,92,.16);
--bg-modifier-active:rgba(79,84,92,.32);
--bg-modifier-selected:rgba(79,84,92,.48);
--text-normal:#dbdee1;
--text-muted:#80848e;
--text-link:#00a8fc;
--text-positive:#23a55a;
--text-warning:#f0b232;
--text-danger:#f23f43;
--header-primary:#f2f3f5;
--header-secondary:#b5bac1;
--interactive-normal:#b5bac1;
--interactive-hover:#dbdee1;
--interactive-active:#f2f3f5;
--interactive-muted:#41434a;
--brand:#5865f2;
--brand-hover:#4752c4;
--brand-active:#3c45a5;
--green:#23a55a;
--red:#f23f43;
--yellow:#f0b232;
--channel-icon:#80848e;
--scrollbar-thin:#1a1b1e;
--scrollbar-thumb:#2b2d31;
--scrollbar-thumb-hover:#1a1b1e;
--input-bg:#1e1f22;
--sidebar-width:240px;
--server-sidebar-width:72px;
--font-primary:'Noto Sans',sans-serif;
}
body{font-family:var(--font-primary);background:var(--bg-primary);color:var(--text-normal);height:100vh;overflow:hidden;display:flex;flex-direction:column}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--scrollbar-thin);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--scrollbar-thumb-hover)}
input,textarea,select{font-family:var(--font-primary)}
button{cursor:pointer;font-family:var(--font-primary)}
a{color:var(--text-link);text-decoration:none}
a:hover{text-decoration:underline}

/* AUTH */
#auth-screen{position:fixed;inset:0;background:radial-gradient(ellipse at 60% 30%,#404796 0%,#1e1f22 60%);display:flex;align-items:center;justify-content:center;z-index:9999}
.auth-box{background:var(--bg-secondary);border-radius:8px;padding:32px;width:100%;max-width:480px;box-shadow:0 8px 16px rgba(0,0,0,.24)}
.auth-box h2{color:var(--header-primary);font-size:24px;font-weight:700;text-align:center;margin-bottom:8px}
.auth-box p.subtitle{color:var(--text-muted);text-align:center;font-size:14px;margin-bottom:20px}
.auth-logo{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:20px}
.auth-logo svg{width:40px;height:40px;fill:#5865f2}
.auth-logo span{font-size:28px;font-weight:800;color:#fff;letter-spacing:-1px}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--header-secondary);margin-bottom:8px}
.form-group input{width:100%;padding:10px;background:var(--input-bg);border:1px solid rgba(0,0,0,.3);border-radius:4px;color:var(--text-normal);font-size:16px;outline:none;transition:border-color .15s}
.form-group input:focus{border-color:var(--brand)}
.form-group input.error{border-color:var(--red)}
.err-msg{color:var(--text-danger);font-size:12px;margin-top:4px}
.btn-primary{width:100%;padding:12px;background:var(--brand);color:#fff;font-size:16px;font-weight:500;border:none;border-radius:4px;transition:background .15s;margin-top:4px}
.btn-primary:hover{background:var(--brand-hover)}
.btn-primary:active{background:var(--brand-active)}
.btn-google{width:100%;padding:10px;background:#fff;color:#333;font-size:14px;font-weight:500;border:none;border-radius:4px;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:8px;transition:background .15s}
.btn-google:hover{background:#f5f5f5}
.btn-google svg{width:18px;height:18px}
.auth-divider{display:flex;align-items:center;gap:8px;margin:12px 0;color:var(--text-muted);font-size:12px}
.auth-divider::before,.auth-divider::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.1)}
.auth-switch{text-align:center;margin-top:16px;font-size:14px;color:var(--text-muted)}
.auth-switch a{color:var(--brand)}

/* MAIN APP */
#app{display:none;flex:1;flex-direction:row;height:100vh;overflow:hidden}
#app.visible{display:flex}

/* SERVER SIDEBAR */
#server-sidebar{width:var(--server-sidebar-width);background:var(--bg-tertiary);display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:2px;overflow-y:auto;flex-shrink:0}
.server-icon{width:48px;height:48px;border-radius:50%;background:var(--bg-secondary);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:border-radius .15s,background .15s;position:relative;flex-shrink:0;overflow:hidden}
.server-icon:hover,.server-icon.active{border-radius:16px;background:var(--brand)}
.server-icon img{width:100%;height:100%;object-fit:cover}
.server-icon span{font-size:18px;font-weight:700;color:#fff;pointer-events:none}
.server-icon .notif-badge{position:absolute;bottom:-2px;right:-2px;width:16px;height:16px;background:var(--red);border:2px solid var(--bg-tertiary);border-radius:50%;font-size:9px;color:#fff;display:flex;align-items:center;justify-content:center}
.server-separator{width:32px;height:2px;background:rgba(255,255,255,.08);border-radius:1px;margin:4px 0}
.server-add-btn{width:48px;height:48px;border-radius:50%;background:var(--bg-secondary);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:border-radius .15s,background .15s;color:var(--green);font-size:24px;flex-shrink:0}
.server-add-btn:hover{border-radius:16px;background:var(--green);color:#fff}
.home-btn{background:var(--brand)}
.home-btn:hover{border-radius:16px;background:var(--brand-hover)}
.home-btn:not(.active){background:var(--bg-secondary)}
.home-btn:not(.active):hover{background:var(--brand);border-radius:16px}

/* CHANNEL SIDEBAR */
#channel-sidebar{width:var(--sidebar-width);background:var(--bg-secondary);display:flex;flex-direction:column;flex-shrink:0}
.sidebar-header{padding:12px 16px;border-bottom:1px solid rgba(0,0,0,.2);font-weight:700;font-size:15px;color:var(--header-primary);min-height:48px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.sidebar-header svg{color:var(--text-muted);cursor:pointer;transition:color .15s}
.sidebar-header svg:hover{color:var(--text-normal)}
.channel-list{flex:1;overflow-y:auto;padding:8px 0}
.channel-category{padding:0 8px;margin-top:8px}
.channel-category-header{display:flex;align-items:center;gap:4px;padding:6px 4px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted);cursor:pointer;transition:color .15s;border-radius:4px}
.channel-category-header:hover{color:var(--text-normal)}
.channel-category-header svg{transition:transform .15s}
.channel-category-header.collapsed svg{transform:rotate(-90deg)}
.channel-item{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:4px;cursor:pointer;transition:background .1s;color:var(--text-muted);font-size:15px;margin:1px 4px;position:relative}
.channel-item:hover{background:var(--bg-modifier-hover);color:var(--interactive-hover)}
.channel-item.active{background:var(--bg-modifier-selected);color:var(--interactive-active)}
.channel-item svg{flex-shrink:0;color:var(--channel-icon)}
.channel-item.active svg{color:var(--interactive-active)}
.channel-item span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.channel-item .unread-badge{background:var(--red);color:#fff;border-radius:8px;font-size:10px;padding:0 4px;min-width:16px;height:16px;display:flex;align-items:center;justify-content:center;font-weight:700}
.add-channel-btn{opacity:0;transition:opacity .15s;margin-left:auto;color:var(--text-muted)}
.channel-category:hover .add-channel-btn{opacity:1}
.add-channel-btn:hover{color:var(--text-normal)}
.user-panel{padding:8px;background:var(--bg-quaternary);display:flex;align-items:center;gap:8px;flex-shrink:0}
.user-panel-avatar{width:32px;height:32px;border-radius:50%;background:var(--brand);overflow:hidden;position:relative;flex-shrink:0}
.user-panel-avatar img{width:100%;height:100%;object-fit:cover}
.user-panel-avatar .status-dot{position:absolute;bottom:-1px;right:-1px;width:10px;height:10px;border-radius:50%;border:2px solid var(--bg-quaternary)}
.status-dot.online{background:var(--green)}
.status-dot.offline{background:var(--text-muted)}
.status-dot.idle{background:var(--yellow)}
.status-dot.dnd{background:var(--red)}
.user-panel-info{flex:1;min-width:0}
.user-panel-name{font-size:13px;font-weight:600;color:var(--header-primary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.user-panel-status{font-size:11px;color:var(--text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.user-panel-controls{display:flex;gap:2px}
.icon-btn{width:32px;height:32px;border-radius:4px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--interactive-normal);transition:color .15s,background .15s;border:none;background:transparent}
.icon-btn:hover{color:var(--interactive-hover);background:var(--bg-modifier-hover)}

/* CHAT AREA */
#chat-area{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg-primary)}
.chat-header{padding:0 16px;border-bottom:1px solid rgba(0,0,0,.2);min-height:48px;display:flex;align-items:center;gap:8px;flex-shrink:0}
.chat-header .channel-name{font-weight:700;font-size:15px;color:var(--header-primary)}
.chat-header .channel-desc{font-size:14px;color:var(--text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-header svg{color:var(--channel-icon);flex-shrink:0}
.chat-header-divider{width:1px;height:24px;background:rgba(255,255,255,.1);margin:0 4px}
.chat-messages{flex:1;overflow-y:auto;padding:16px 0;display:flex;flex-direction:column}
.msg-group{display:flex;gap:16px;padding:2px 16px;margin-bottom:4px;transition:background .1s;border-radius:4px}
.msg-group:hover{background:var(--bg-modifier-hover)}
.msg-avatar{width:40px;height:40px;border-radius:50%;flex-shrink:0;margin-top:4px;overflow:hidden;background:var(--brand)}
.msg-avatar img{width:100%;height:100%;object-fit:cover}
.msg-content{flex:1;min-width:0}
.msg-header{display:flex;align-items:baseline;gap:8px;margin-bottom:2px}
.msg-author{font-weight:500;font-size:15px;color:var(--header-primary);cursor:pointer}
.msg-author:hover{text-decoration:underline}
.msg-time{font-size:11px;color:var(--text-muted)}
.msg-text{font-size:15px;line-height:1.375;color:var(--text-normal);word-break:break-word}
.msg-text a{color:var(--text-link)}
.msg-continued{display:flex;gap:16px;padding:1px 16px;transition:background .1s}
.msg-continued:hover{background:var(--bg-modifier-hover)}
.msg-continued .msg-time-small{width:40px;flex-shrink:0;font-size:10px;color:transparent;text-align:right;padding-top:2px;line-height:1.6}
.msg-continued:hover .msg-time-small{color:var(--text-muted)}
.welcome-msg{padding:16px;margin:0 16px 16px;border-top:1px solid rgba(255,255,255,.06)}
.welcome-msg h3{font-size:32px;font-weight:800;color:var(--header-primary);margin-bottom:8px}
.welcome-msg p{color:var(--text-muted);font-size:15px}
.chat-input-area{padding:0 16px 24px;flex-shrink:0}
.chat-input-wrapper{background:var(--bg-quaternary);border-radius:8px;display:flex;align-items:center;gap:8px;padding:0 16px}
.chat-input{flex:1;background:transparent;border:none;outline:none;color:var(--text-normal);font-size:15px;padding:11px 0;max-height:200px;resize:none;font-family:var(--font-primary);line-height:1.375}
.chat-input::placeholder{color:var(--text-muted)}
.chat-input-btn{color:var(--text-muted);transition:color .15s;background:none;border:none;padding:4px;border-radius:4px;display:flex;align-items:center}
.chat-input-btn:hover{color:var(--text-normal)}

/* FRIENDS PANEL */
#friends-panel{flex:1;display:flex;flex-direction:column;overflow:hidden}
.friends-header{padding:0 20px;border-bottom:1px solid rgba(0,0,0,.2);min-height:48px;display:flex;align-items:center;gap:12px;flex-shrink:0}
.friends-header svg{color:var(--text-muted);flex-shrink:0}
.friends-header span{font-weight:700;font-size:15px;color:var(--header-primary)}
.friends-nav{display:flex;gap:2px;margin-left:12px}
.friends-nav-btn{padding:4px 10px;border-radius:4px;font-size:14px;color:var(--text-muted);cursor:pointer;border:none;background:transparent;transition:background .1s,color .1s}
.friends-nav-btn:hover{background:var(--bg-modifier-hover);color:var(--text-normal)}
.friends-nav-btn.active{background:var(--bg-modifier-selected);color:var(--interactive-active)}
.friends-nav-btn.add-btn{background:var(--green);color:#fff;padding:4px 12px}
.friends-nav-btn.add-btn:hover{background:#1e8c4a}
.friends-content{flex:1;overflow-y:auto;padding:20px}
.friends-section-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted);margin-bottom:12px}
.friend-item{display:flex;align-items:center;gap:12px;padding:12px 8px;border-radius:8px;transition:background .1s;cursor:pointer}
.friend-item:hover{background:var(--bg-modifier-hover)}
.friend-avatar{width:32px;height:32px;border-radius:50%;position:relative;flex-shrink:0;overflow:hidden;background:var(--brand)}
.friend-avatar img{width:100%;height:100%;object-fit:cover}
.friend-info{flex:1}
.friend-name{font-weight:600;font-size:14px;color:var(--header-primary)}
.friend-status{font-size:12px;color:var(--text-muted)}
.friend-actions{display:flex;gap:8px}
.friend-action-btn{width:32px;height:32px;border-radius:50%;background:var(--bg-secondary);border:none;color:var(--text-muted);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .15s,color .15s}
.friend-action-btn:hover{background:var(--bg-modifier-hover);color:var(--text-normal)}
.friend-action-btn.accept:hover{background:var(--green);color:#fff}
.friend-action-btn.reject:hover{background:var(--red);color:#fff}
.add-friend-box{background:var(--bg-secondary);border-radius:8px;padding:20px;margin-bottom:20px}
.add-friend-box h3{font-size:20px;font-weight:700;color:var(--header-primary);margin-bottom:4px}
.add-friend-box p{font-size:14px;color:var(--text-muted);margin-bottom:16px}
.add-friend-input-row{display:flex;gap:8px}
.add-friend-input{flex:1;background:var(--input-bg);border:1px solid rgba(0,0,0,.3);border-radius:4px;padding:10px 12px;color:var(--text-normal);font-size:14px;outline:none}
.add-friend-input:focus{border-color:var(--brand)}
.add-friend-btn{background:var(--brand);color:#fff;border:none;border-radius:4px;padding:10px 16px;font-size:14px;font-weight:500;white-space:nowrap;transition:background .15s}
.add-friend-btn:hover{background:var(--brand-hover)}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;text-align:center;color:var(--text-muted)}
.empty-state svg{margin-bottom:16px;opacity:.4}
.empty-state h3{font-size:17px;font-weight:700;color:var(--header-secondary);margin-bottom:8px}
.empty-state p{font-size:14px}

/* DM SIDEBAR */
.dm-list{flex:1;overflow-y:auto;padding:8px 0}
.dm-section{padding:4px 8px;margin-bottom:4px}
.dm-section-header{padding:6px 8px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted)}
.dm-item{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:4px;cursor:pointer;transition:background .1s;margin:1px 4px}
.dm-item:hover{background:var(--bg-modifier-hover)}
.dm-item.active{background:var(--bg-modifier-selected)}
.dm-item-avatar{width:32px;height:32px;border-radius:50%;flex-shrink:0;position:relative;overflow:hidden;background:var(--brand)}
.dm-item-avatar img{width:100%;height:100%;object-fit:cover}
.dm-item-info{flex:1;min-width:0}
.dm-item-name{font-size:14px;font-weight:500;color:var(--interactive-normal);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dm-item.active .dm-item-name,.dm-item:hover .dm-item-name{color:var(--interactive-active)}
.dm-item-preview{font-size:12px;color:var(--text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dm-item-close{opacity:0;color:var(--text-muted);margin-left:auto}
.dm-item:hover .dm-item-close{opacity:1}
.dm-item-close:hover{color:var(--text-normal)}

/* MODALS */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:1000;animation:fadeIn .1s ease}
.modal{background:var(--bg-secondary);border-radius:8px;padding:24px;width:100%;max-width:440px;box-shadow:0 8px 16px rgba(0,0,0,.24);animation:slideUp .2s ease}
.modal h2{font-size:20px;font-weight:700;color:var(--header-primary);margin-bottom:8px}
.modal p{font-size:14px;color:var(--text-muted);margin-bottom:20px}
.modal-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.btn-secondary{padding:10px 16px;background:transparent;border:none;color:var(--text-normal);font-size:14px;border-radius:4px;transition:background .15s}
.btn-secondary:hover{background:var(--bg-modifier-hover);text-decoration:underline}
.btn-danger{padding:10px 16px;background:var(--red);border:none;color:#fff;font-size:14px;border-radius:4px;transition:background .15s}
.btn-danger:hover{background:#b02b2e}
.btn-sm{padding:8px 16px;font-size:14px;border-radius:4px;border:none;color:#fff;cursor:pointer;transition:background .15s}
.btn-sm.brand{background:var(--brand)}
.btn-sm.brand:hover{background:var(--brand-hover)}

/* CONTEXT MENU */
.ctx-menu{position:fixed;background:var(--bg-tertiary);border-radius:6px;padding:6px;min-width:160px;box-shadow:0 8px 16px rgba(0,0,0,.5);z-index:2000;animation:fadeIn .1s ease}
.ctx-item{padding:8px 10px;border-radius:4px;font-size:14px;cursor:pointer;color:var(--text-normal);transition:background .1s;display:flex;align-items:center;gap:8px}
.ctx-item:hover{background:var(--brand);color:#fff}
.ctx-item.danger:hover{background:var(--red)}
.ctx-divider{height:1px;background:rgba(255,255,255,.06);margin:4px 0}

/* VOICE */
.voice-indicator{background:var(--bg-quaternary);padding:6px 8px;font-size:12px;color:var(--text-muted);border-top:1px solid rgba(0,0,0,.2);display:flex;align-items:center;gap:6px}
.voice-indicator.connected{color:var(--green)}
.voice-indicator svg{flex-shrink:0}
.voice-users{display:flex;flex-wrap:wrap;gap:4px;padding:4px 8px 8px}
.voice-user-chip{display:flex;align-items:center;gap:6px;background:var(--bg-quaternary);border-radius:4px;padding:4px 8px;font-size:13px;color:var(--text-muted)}
.voice-user-chip.speaking{border:1px solid var(--green);color:var(--green)}

/* MEMBER LIST */
#member-list{width:240px;background:var(--bg-secondary);flex-shrink:0;display:flex;flex-direction:column;border-left:1px solid rgba(0,0,0,.2)}
.member-list-inner{flex:1;overflow-y:auto;padding:16px 8px}
.member-section-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted);padding:8px 8px 4px}
.member-item{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:4px;cursor:pointer;transition:background .1s}
.member-item:hover{background:var(--bg-modifier-hover)}
.member-avatar{width:32px;height:32px;border-radius:50%;flex-shrink:0;position:relative;overflow:hidden;background:var(--brand)}
.member-avatar img{width:100%;height:100%;object-fit:cover}
.member-name{font-size:14px;color:var(--interactive-normal);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.member-item:hover .member-name{color:var(--interactive-active)}

/* TOAST */
.toast-container{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column;gap:8px;z-index:9999}
.toast{background:var(--bg-secondary);color:var(--text-normal);padding:12px 16px;border-radius:6px;font-size:14px;box-shadow:0 4px 12px rgba(0,0,0,.4);animation:slideInRight .2s ease;border-left:4px solid var(--brand);max-width:280px}
.toast.success{border-color:var(--green)}
.toast.error{border-color:var(--red)}
.toast.warning{border-color:var(--yellow)}

/* PROFILE POPUP */
.profile-popup{position:fixed;background:var(--bg-secondary);border-radius:8px;width:280px;box-shadow:0 8px 16px rgba(0,0,0,.5);z-index:1500;overflow:hidden;animation:fadeIn .15s ease}
.profile-popup-banner{height:60px;background:var(--brand)}
.profile-popup-body{padding:12px}
.profile-popup-avatar{width:72px;height:72px;border-radius:50%;border:4px solid var(--bg-secondary);margin-top:-36px;overflow:hidden;background:var(--brand)}
.profile-popup-avatar img{width:100%;height:100%;object-fit:cover}
.profile-popup-name{font-size:20px;font-weight:800;color:var(--header-primary);margin-top:8px}
.profile-popup-tag{font-size:14px;color:var(--text-muted);margin-bottom:12px}
.profile-popup-divider{height:1px;background:rgba(255,255,255,.08);margin:8px 0}

/* LOADING */
.loading{display:flex;align-items:center;justify-content:center;flex:1;color:var(--text-muted)}
.spinner{width:32px;height:32px;border:3px solid rgba(255,255,255,.1);border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes slideInRight{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}

/* RESPONSIVE */
@media(max-width:768px){
#member-list{display:none}
#channel-sidebar{position:absolute;left:0;top:0;bottom:0;z-index:100;transform:translateX(-100%);transition:transform .2s}
#channel-sidebar.open{transform:translateX(0)}
}
.typing-indicator{padding:4px 16px;font-size:12px;color:var(--text-muted);height:24px}
.typing-dots span{display:inline-block;width:4px;height:4px;background:var(--text-muted);border-radius:50%;margin:0 1px;animation:bounce .6s infinite}
.typing-dots span:nth-child(2){animation-delay:.15s}
.typing-dots span:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.unread-marker{display:flex;align-items:center;gap:8px;padding:4px 16px;margin:8px 0}
.unread-marker span{font-size:12px;font-weight:700;color:var(--red);white-space:nowrap}
.unread-marker::before,.unread-marker::after{content:'';flex:1;height:1px;background:var(--red)}
.mention-badge{background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:0 4px;border-radius:8px;min-width:16px;height:16px;display:flex;align-items:center;justify-content:center}
.search-bar{background:var(--bg-tertiary);border:none;outline:none;border-radius:4px;padding:4px 8px;color:var(--text-normal);font-size:14px;width:180px}
.search-bar::placeholder{color:var(--text-muted)}
.nitro-badge{background:linear-gradient(135deg,#e91e8c,#5865f2);color:#fff;font-size:9px;font-weight:700;padding:1px 4px;border-radius:3px;margin-left:4px}
</style>
</head>

<script>
// ============================================================
// FIREBASE CONFIG — replace with your own
// ============================================================
const firebaseConfig = {
  apiKey: "AIzaSyC1UbnB3pce0STRy0oT7RSDMh6KsFK0q6U",
  authDomain: "tconnect-6ac3d.firebaseapp.com",
  databaseURL: "https://tconnect-6ac3d-default-rtdb.firebaseio.com",
  projectId: "tconnect-6ac3d",
  storageBucket: "tconnect-6ac3d.firebasestorage.app",
  messagingSenderId: "503970403348",
  appId: "1:503970403348:web:867ac13dbf6042b5cc8301"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

// ============================================================
// STATE
// ============================================================
let currentUser = null;
let currentUserProfile = null;
let currentServerId = null;
let currentChannelId = null;
let currentDMUserId = null;
let currentView = 'home'; // home | server | dm
let servers = {};
let channels = {};
let friends = {};
let pendingRequests = {};
let dmList = {};
let messages = {};
let typingTimeout = null;
let isMuted = false;
let currentVoiceChannel = null;
let peerConnections = {};
let localStream = null;
let messagesRef = null;
let activeListeners = [];
let friendTab = 'online';
let onlineUsers = {};

// ============================================================
// AUTH
// ============================================================
function showLogin(){
  document.getElementById('auth-login').style.display='block';
  document.getElementById('auth-register').style.display='none';
}
function showRegister(){
  document.getElementById('auth-login').style.display='none';
  document.getElementById('auth-register').style.display='block';
}
function loginWithEmail(){
  const email=document.getElementById('login-email').value.trim();
  const pass=document.getElementById('login-password').value;
  document.getElementById('login-err').textContent='';
  if(!email||!pass){document.getElementById('login-err').textContent='Please fill all fields.';return;}
  auth.signInWithEmailAndPassword(email,pass).catch(e=>{document.getElementById('login-err').textContent=e.message;});
}
function registerWithEmail(){
  const email=document.getElementById('reg-email').value.trim();
  const username=document.getElementById('reg-username').value.trim();
  const pass=document.getElementById('reg-password').value;
  document.getElementById('reg-err').textContent='';
  if(!email||!username||!pass){document.getElementById('reg-err').textContent='Please fill all fields.';return;}
  if(pass.length<6){document.getElementById('reg-err').textContent='Password must be at least 6 characters.';return;}
  auth.createUserWithEmailAndPassword(email,pass).then(cred=>{
    return db.ref('users/'+cred.user.uid).set({
      username,email,avatar:'',status:'online',bio:'',createdAt:Date.now()
    });
  }).catch(e=>{document.getElementById('reg-err').textContent=e.message;});
}
function loginWithGoogle(){
  const provider=new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider).then(result=>{
    const user=result.user;
    db.ref('users/'+user.uid).once('value').then(snap=>{
      if(!snap.exists()){
        db.ref('users/'+user.uid).set({
          username:user.displayName||user.email.split('@')[0],
          email:user.email,avatar:user.photoURL||'',status:'online',bio:'',createdAt:Date.now()
        });
      }
    });
  }).catch(e=>showToast(e.message,'error'));
}
function logout(){
  if(currentUser){
    db.ref('users/'+currentUser.uid+'/status').set('offline');
    db.ref('presence/'+currentUser.uid).remove();
  }
  auth.signOut();
}

auth.onAuthStateChanged(user=>{
  if(user){
    currentUser=user;
    initApp();
  } else {
    currentUser=null;
    document.getElementById('auth-screen').style.display='flex';
    document.getElementById('app').classList.remove('visible');
  }
});

// ============================================================
// APP INIT
// ============================================================
function initApp(){
  document.getElementById('auth-screen').style.display='none';
  document.getElementById('app').classList.add('visible');
  loadUserProfile();
  setupPresence();
  loadServers();
  loadFriends();
  loadDMs();
  showHome();
}

function loadUserProfile(){
  db.ref('users/'+currentUser.uid).on('value',snap=>{
    currentUserProfile=snap.val()||{username:currentUser.email,avatar:'',status:'online'};
    updateUserPanel();
  });
}

function updateUserPanel(){
  const p=currentUserProfile;
  if(!p)return;
  document.getElementById('user-panel-name').textContent=p.username||'User';
  document.getElementById('user-panel-status-text').textContent=capitalize(p.status||'online');
  const dot=document.getElementById('user-status-dot');
  dot.className='status-dot '+(p.status||'online');
  const av=document.getElementById('user-panel-avatar');
  if(p.avatar){av.innerHTML=`<img src="${p.avatar}"><div class="status-dot ${p.status||'online'}" style="position:absolute;bottom:-1px;right:-1px;border:2px solid var(--bg-quaternary)"></div>`;}
  else{av.innerHTML=`<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:var(--brand);color:#fff;font-weight:700;font-size:16px;border-radius:50%">${(p.username||'U')[0].toUpperCase()}</div><div class="status-dot ${p.status||'online'}" style="position:absolute;bottom:-1px;right:-1px;border:2px solid var(--bg-quaternary)"></div>`;}
}

function setupPresence(){
  const presRef=db.ref('presence/'+currentUser.uid);
  presRef.set({uid:currentUser.uid,online:true});
  presRef.onDisconnect().remove();
  db.ref('users/'+currentUser.uid+'/status').set('online');
  db.ref('users/'+currentUser.uid+'/status').onDisconnect().set('offline');
  db.ref('presence').on('value',snap=>{
    onlineUsers={};
    if(snap.val())Object.keys(snap.val()).forEach(uid=>{onlineUsers[uid]=true;});
    refreshFriendsView();
    refreshMemberList();
  });
}

// ============================================================
// SERVERS
// ============================================================
function loadServers(){
  db.ref('userServers/'+currentUser.uid).on('value',snap=>{
    servers={};
    if(!snap.val()){renderServerList();return;}
    const ids=Object.keys(snap.val());
    let loaded=0;
    if(ids.length===0){renderServerList();return;}
    ids.forEach(sid=>{
      db.ref('servers/'+sid).once('value').then(s=>{
        if(s.val())servers[sid]={...s.val(),id:sid};
        loaded++;
        if(loaded===ids.length)renderServerList();
      });
    });
  });
}

function renderServerList(){
  const list=document.getElementById('server-list');
  list.innerHTML='';
  Object.values(servers).forEach(s=>{
    const el=document.createElement('div');
    el.className='server-icon'+(currentServerId===s.id?' active':'');
    el.title=s.name;
    el.onclick=()=>selectServer(s.id);
    if(s.icon){el.innerHTML=`<img src="${s.icon}" alt="${s.name}">`;}
    else{el.innerHTML=`<span>${s.name[0].toUpperCase()}</span>`;}
    list.appendChild(el);
  });
}

function selectServer(sid){
  currentServerId=sid;
  currentView='server';
  currentDMUserId=null;
  document.getElementById('home-btn').classList.remove('active');
  renderServerList();
  document.querySelectorAll('.server-icon').forEach(el=>{el.classList.toggle('active',el.title===servers[sid]?.name);});
  loadServerChannels(sid);
  showServerUI();
}

function showServerUI(){
  document.getElementById('dm-list-area').style.display='none';
  document.getElementById('server-channels-area').style.display='block';
  document.getElementById('friends-panel').style.display='none';
  document.getElementById('chat-area').style.display='flex';
  document.getElementById('member-list').style.display='flex';
  const s=servers[currentServerId];
  if(s)document.getElementById('sidebar-title').textContent=s.name;
}

function loadServerChannels(sid){
  const inner=document.getElementById('channel-list-inner');
  inner.innerHTML='';
  db.ref('channels/'+sid).once('value').then(snap=>{
    channels={};
    if(!snap.val()){createDefaultChannels(sid);return;}
    const chans=snap.val();
    let textChans=[],voiceChans=[];
    Object.entries(chans).forEach(([cid,ch])=>{
      channels[cid]={...ch,id:cid};
      if(ch.type==='voice')voiceChans.push({...ch,id:cid});
      else textChans.push({...ch,id:cid});
    });
    renderChannels(textChans,voiceChans);
    if(textChans.length>0&&!currentChannelId)selectChannel(textChans[0].id);
  });
}

function renderChannels(textChans,voiceChans){
  const inner=document.getElementById('channel-list-inner');
  inner.innerHTML='';
  const textCat=createCategory('TEXT CHANNELS',textChans,'text');
  const voiceCat=createCategory('VOICE CHANNELS',voiceChans,'voice');
  inner.appendChild(textCat);
  inner.appendChild(voiceCat);
  loadServerMembers(currentServerId);
}

function createCategory(name,chans,type){
  const cat=document.createElement('div');
  cat.className='channel-category';
  const header=document.createElement('div');
  header.className='channel-category-header';
  header.innerHTML=`<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M7 10l5 5 5-5z"/></svg><span style="flex:1">${name}</span><span class="add-channel-btn" onclick="showAddChannelModal('${type}')">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg></span>`;
  header.onclick=(e)=>{if(e.target.closest('.add-channel-btn'))return;header.classList.toggle('collapsed');};
  cat.appendChild(header);
  const list=document.createElement('div');
  chans.forEach(ch=>{
    const item=document.createElement('div');
    item.className='channel-item'+(currentChannelId===ch.id?' active':'');
    item.id='ch-'+ch.id;
    const icon=type==='voice'?`<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>`:
    `<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-2 12H6v-2h12v2zm0-3H6V9h12v2zm0-3H6V6h12v2z"/></svg>`;
    item.innerHTML=`${icon}<span>${ch.name}</span>`;
    item.onclick=()=>{
      if(type==='voice')joinVoiceChannel(ch.id,ch.name);
      else selectChannel(ch.id);
    };
    item.oncontextmenu=(e)=>{e.preventDefault();showChannelCtxMenu(e,ch);};
    list.appendChild(item);
  });
  cat.appendChild(list);
  return cat;
}

function createDefaultChannels(sid){
  const gid=db.ref('channels/'+sid).push().key;
  const vid=db.ref('channels/'+sid).push().key;
  const updates={};
  updates[`channels/${sid}/${gid}`]={name:'general',type:'text',createdAt:Date.now()};
  updates[`channels/${sid}/${vid}`]={name:'General',type:'voice',createdAt:Date.now()};
  db.ref().update(updates).then(()=>loadServerChannels(sid));
}

function selectChannel(cid){
  currentChannelId=cid;
  document.querySelectorAll('.channel-item').forEach(el=>el.classList.remove('active'));
  const el=document.getElementById('ch-'+cid);
  if(el)el.classList.add('active');
  const ch=channels[cid];
  if(ch){
    document.getElementById('chat-channel-name').textContent=ch.name;
    document.getElementById('chat-channel-desc').textContent=ch.topic||'';
    document.getElementById('chat-input').placeholder=`Message #${ch.name}`;
  }
  loadMessages();
}

function showAddChannelModal(type){
  showModal(`<h2>Create ${type==='voice'?'Voice':'Text'} Channel</h2>
<p>Create a new ${type} channel for your server.</p>
<div class="form-group"><label>Channel Name</label><input type="text" id="new-ch-name" placeholder="${type==='voice'?'New Voice':'new-channel'}"></div>`,
  [{label:'Create Channel',action:()=>{
    const name=document.getElementById('new-ch-name').value.trim();
    if(!name)return;
    const cid=db.ref('channels/'+currentServerId).push().key;
    db.ref('channels/'+currentServerId+'/'+cid).set({name,type,createdAt:Date.now()}).then(()=>{
      closeModal();loadServerChannels(currentServerId);showToast('Channel created!','success');
    });
  },primary:true},{label:'Cancel',action:closeModal}]);
}

// MESSAGES
// ============================================================
function loadMessages(){
  if(messagesRef)messagesRef.off();
  const msgs=document.getElementById('chat-messages');
  msgs.innerHTML='<div class="loading"><div class="spinner"></div></div>';
  messages={};
  const path=currentView==='dm'?`dms/${getDMKey(currentUser.uid,currentDMUserId)}/messages`:`serverMessages/${currentServerId}/${currentChannelId}`;
  messagesRef=db.ref(path).limitToLast(50);
  messagesRef.on('value',snap=>{
    messages={};
    if(snap.val())Object.entries(snap.val()).forEach(([id,m])=>messages[id]=m);
    renderMessages();
  });
}

function getDMKey(uid1,uid2){return [uid1,uid2].sort().join('_');}

function renderMessages(){
  const container=document.getElementById('chat-messages');
  container.innerHTML='';
  const ch=currentView==='dm'?null:channels[currentChannelId];
  const welcome=document.createElement('div');
  welcome.className='welcome-msg';
  if(currentView==='dm'){
    welcome.innerHTML=`<h3>This is the beginning of your direct message history with a friend</h3><p>Only the two of you are in this conversation.</p>`;
  } else {
    welcome.innerHTML=`<h3>${ch?'#'+ch.name:''}</h3><p>${ch&&ch.topic?ch.topic:'This is the start of this channel. Say hi!'}</p>`;
  }
  container.appendChild(welcome);
  const msgs=Object.values(messages).sort((a,b)=>a.timestamp-b.timestamp);
  let lastUid='',lastTime=0;
  msgs.forEach(msg=>{
    const isSameUser=msg.uid===lastUid&&(msg.timestamp-lastTime)<300000;
    if(isSameUser){
      const cont=document.createElement('div');
      cont.className='msg-continued';
      const t=new Date(msg.timestamp);
      cont.innerHTML=`<div class="msg-time-small">${t.getHours().toString().padStart(2,'0')}:${t.getMinutes().toString().padStart(2,'0')}</div><div class="msg-text">${escapeHtml(msg.text)}</div>`;
      container.appendChild(cont);
    } else {
      const group=document.createElement('div');
      group.className='msg-group';
      const t=new Date(msg.timestamp);
      const dateStr=`Today at ${t.getHours().toString().padStart(2,'0')}:${t.getMinutes().toString().padStart(2,'0')}`;
      group.innerHTML=`<div class="msg-avatar">${msg.avatar?`<img src="${msg.avatar}">`:`<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:var(--brand);color:#fff;font-weight:700;border-radius:50%">${(msg.username||'U')[0].toUpperCase()}</div>`}</div>
<div class="msg-content"><div class="msg-header"><span class="msg-author" onclick="showProfilePopup(event,'${msg.uid}')">${escapeHtml(msg.username||'User')}</span><span class="msg-time">${dateStr}</span></div><div class="msg-text">${escapeHtml(msg.text)}</div></div>`;
      group.oncontextmenu=(e)=>{e.preventDefault();showMsgCtxMenu(e,msg);};
      container.appendChild(group);
    }
    lastUid=msg.uid;lastTime=msg.timestamp;
  });
  container.scrollTop=container.scrollHeight;
}

function sendMessage(){
  const input=document.getElementById('chat-input');
  const text=input.value.trim();
  if(!text||!currentUser)return;
  const msg={uid:currentUser.uid,username:currentUserProfile?.username||'User',avatar:currentUserProfile?.avatar||'',text,timestamp:Date.now()};
  const path=currentView==='dm'?`dms/${getDMKey(currentUser.uid,currentDMUserId)}/messages`:`serverMessages/${currentServerId}/${currentChannelId}`;
  db.ref(path).push(msg);
  if(currentView==='dm'){
    const dmKey=getDMKey(currentUser.uid,currentDMUserId);
    db.ref(`userDMs/${currentUser.uid}/${currentDMUserId}`).set({lastMsg:text,timestamp:Date.now(),uid:currentDMUserId});
    db.ref(`userDMs/${currentDMUserId}/${currentUser.uid}`).set({lastMsg:text,timestamp:Date.now(),uid:currentUser.uid});
  }
  input.value='';
  input.style.height='auto';
  clearTyping();
}

function handleChatKeydown(e){
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();}
}

function handleTyping(){
  const input=document.getElementById('chat-input');
  input.style.height='auto';
  input.style.height=Math.min(input.scrollHeight,200)+'px';
  if(!currentUser)return;
  const path=currentView==='dm'?`dms/${getDMKey(currentUser.uid,currentDMUserId)}/typing/${currentUser.uid}`:`serverMessages/${currentServerId}/${currentChannelId}/typing/${currentUser.uid}`;
  db.ref(path).set({username:currentUserProfile?.username||'User',t:Date.now()});
  clearTimeout(typingTimeout);
  typingTimeout=setTimeout(clearTyping,2000);
}

function clearTyping(){
  if(!currentUser)return;
  const path=currentView==='dm'?`dms/${getDMKey(currentUser.uid,currentDMUserId)}/typing/${currentUser.uid}`:`serverMessages/${currentServerId}/${currentChannelId}/typing/${currentUser.uid}`;
  db.ref(path).remove();
}

function loadFriends(){

    friends=snap.val()||{};

  });

    document.getElementById('fn-pending').textContent=count>0?`Pending (${count})`:'Pending';
    refreshFriendsView();
  });
}

function showHome(){
  currentView='home';
  currentServerId=null;
  currentChannelId=null;
  currentDMUserId=null;
  document.getElementById('home-btn').classList.add('active');
  renderServerList();
  document.getElementById('dm-list-area').style.display='block';
  document.getElementById('server-channels-area').style.display='none';
  document.getElementById('friends-panel').style.display='flex';
  document.getElementById('chat-area').style.display='none';
  document.getElementById('member-list').style.display='none';
  document.getElementById('sidebar-title').textContent='Direct Messages';
  showFriendTab('online');
}

function showFriendTab(tab){
  friendTab=tab;
  ['online','all','pending','add'].forEach(t=>{
    const btn=document.getElementById('fn-'+t);
    if(btn)btn.classList.toggle('active',t===tab);
  });
  refreshFriendsView();
}

function refreshFriendsView(){
  if(currentView!=='home'&&currentView!=='friends')return;
  const content=document.getElementById('friends-content');
  if(!content)return;
  if(friendTab==='add'){
    content.innerHTML=`<div class="add-friend-box">
<h3>Add Friend</h3><p>You can add friends with their username or email.</p>
<div class="add-friend-input-row">
<input class="add-friend-input" id="add-friend-input" placeholder="Enter username or email">
<button class="add-friend-btn" onclick="sendFriendRequest()">Send Friend Request</button>
</div><div id="add-friend-msg" style="margin-top:8px;font-size:13px;color:var(--text-muted)"></div></div>`;
    return;
  }
  const friendIds=Object.keys(friends);
  let html='';
  if(friendTab==='pending'){
    const reqs=Object.entries(pendingRequests);
    if(reqs.length===0){html='<div class="empty-state"><svg width="64" height="64" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg><h3>No pending requests</h3><p>You have no pending friend requests.</p></div>';}
    else{html='<div class="friends-section-title">PENDING — '+reqs.length+'</div>';
    reqs.forEach(([uid,req])=>{html+=friendItemHTML(uid,req.username||'User','Incoming Friend Request',`<button class="friend-action-btn accept" onclick="acceptFriend('${uid}')" title="Accept">✓</button><button class="friend-action-btn reject" onclick="rejectFriend('${uid}')" title="Ignore">✗</button>`);});}
  } else {
    const list=friendIds.filter(uid=>{
      if(friendTab==='online')return onlineUsers[uid];
      return true;
    });
    if(list.length===0){html='<div class="empty-state"><svg width="80" height="80" viewBox="0 0 24 24" fill="currentColor"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg><h3>No friends '+(friendTab==='online'?'online':'found')+'</h3><p>Add friends to start chatting!</p></div>';}
    else{html='<div class="friends-section-title">'+(friendTab==='online'?'ONLINE':'ALL FRIENDS')+' — '+list.length+'</div>';
    list.forEach(uid=>{
      const f=friends[uid];
      const status=onlineUsers[uid]?'Online':'Offline';
      html+=friendItemHTML(uid,f?.username||'User',status,`<button class="friend-action-btn" onclick="openDM('${uid}','${(f?.username||'User').replace(/'/g,"\\'")}','')" title="Message">💬</button><button class="friend-action-btn reject" onclick="removeFriend('${uid}')" title="Remove">✗</button>`);
    });}
  }
  content.innerHTML=html;
}

function friendItemHTML(uid,name,status,actions){
  return `<div class="friend-item"><div class="friend-avatar"><div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:var(--brand);color:#fff;font-weight:700;border-radius:50%">${name[0].toUpperCase()}</div><div class="status-dot ${status==='Online'?'online':'offline'}" style="position:absolute;bottom:-1px;right:-1px;border:2px solid var(--bg-secondary)"></div></div><div class="friend-info"><div class="friend-name">${escapeHtml(name)}</div><div class="friend-status">${status}</div></div><div class="friend-actions">${actions}</div></div>`;
}

function sendFriendRequest(){
  const input=document.getElementById('add-friend-input');
  const val=input.value.trim();
  const msgEl=document.getElementById('add-friend-msg');
  if(!val){msgEl.textContent='Please enter a username or email.';msgEl.style.color='var(--red)';return;}
  db.ref('users').orderByChild('email').equalTo(val).once('value').then(snap=>{
    let found=null;
    if(snap.val())Object.entries(snap.val()).forEach(([uid,u])=>{if(uid!==currentUser.uid)found={uid,...u};});
    if(!found){
      return db.ref('users').orderByChild('username').equalTo(val).once('value').then(snap2=>{
        if(snap2.val())Object.entries(snap2.val()).forEach(([uid,u])=>{if(uid!==currentUser.uid)found={uid,...u};});
        if(!found){msgEl.textContent='User not found.';msgEl.style.color='var(--red)';}
        else sendRequest(found,msgEl,input);
      });
    }
    sendRequest(found,msgEl,input);
  });
}

function sendRequest(found,msgEl,input){
  if(friends[found.uid]){msgEl.textContent='Already friends!';msgEl.style.color='var(--yellow)';return;}
  db.ref('friendRequests/'+found.uid+'/'+currentUser.uid).set({username:currentUserProfile?.username||'User',timestamp:Date.now()}).then(()=>{
    msgEl.textContent='Friend request sent to '+found.username+'!';msgEl.style.color='var(--green)';input.value='';
  });
}

function acceptFriend(uid){
  const req=pendingRequests[uid];
  const updates={};
  updates[`friends/${currentUser.uid}/${uid}`]={username:req?.username||'User',addedAt:Date.now()};
  updates[`friends/${uid}/${currentUser.uid}`]={username:currentUserProfile?.username||'User',addedAt:Date.now()};
  updates[`friendRequests/${currentUser.uid}/${uid}`]=null;
  db.ref().update(updates).then(()=>showToast('Friend added!','success'));
}

function rejectFriend(uid){
  db.ref('friendRequests/'+currentUser.uid+'/'+uid).remove();
}

function removeFriend(uid){
  const updates={};
  updates[`friends/${currentUser.uid}/${uid}`]=null;
  updates[`friends/${uid}/${currentUser.uid}`]=null;
  db.ref().update(updates).then(()=>showToast('Friend removed','success'));
}

function openDM(uid,name,avatar){

function closeDM(uid){
  db.ref(`userDMs/${currentUser.uid}/${uid}`).remove();

}

// ============================================================
// VOICE
// ============================================================
async function joinVoiceChannel(cid,name){
  if(currentVoiceChannel===cid){leaveVoiceChannel();return;}
  try{
    localStream=await navigator.mediaDevices.getUserMedia({audio:true,video:false});
  }catch(e){showToast('Microphone access denied','error');return;}
  if(currentVoiceChannel)leaveVoiceChannel(false);
  currentVoiceChannel=cid;
  const vcRef=db.ref(`voice/${currentServerId}/${cid}/${currentUser.uid}`);
  vcRef.set({username:currentUserProfile?.username||'User',muted:isMuted,timestamp:Date.now()});
  vcRef.onDisconnect().remove();
  document.getElementById('voice-status').style.display='flex';
  document.getElementById('voice-status-text').textContent='Connected to '+name;
  document.getElementById('voice-users-list').style.display='flex';
  document.getElementById('voice-status').classList.add('connected');
  db.ref(`voice/${currentServerId}/${cid}`).on('value',snap=>{
    const users=snap.val()||{};
    renderVoiceUsers(users);
    Object.keys(users).forEach(uid=>{if(uid!==currentUser.uid)setupPeerConnection(uid);});
  });
  showToast('Joined voice: '+name,'success');
}

function leaveVoiceChannel(notify=true){
  if(!currentVoiceChannel)return;
  db.ref(`voice/${currentServerId}/${currentVoiceChannel}/${currentUser.uid}`).remove();
  db.ref(`voice/${currentServerId}/${currentVoiceChannel}`).off();
  Object.values(peerConnections).forEach(pc=>pc.close());
  peerConnections={};
  if(localStream){localStream.getTracks().forEach(t=>t.stop());localStream=null;}
  currentVoiceChannel=null;

async function setupPeerConnection(remoteUid){
  if(peerConnections[remoteUid])return;
  const pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});
  peerConnections[remoteUid]=pc;
  if(localStream)localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));
  pc.ontrack=e=>{const audio=new Audio();audio.srcObject=e.streams[0];audio.play();};
  pc.onicecandidate=e=>{if(e.candidate)db.ref(`voiceSignal/${currentServerId}/${currentVoiceChannel}/${currentUser.uid}/${remoteUid}/ice`).push(e.candidate.toJSON());};
  const offer=await pc.createOffer();
  await pc.setLocalDescription(offer);
  db.ref(`voiceSignal/${currentServerId}/${currentVoiceChannel}/${currentUser.uid}/${remoteUid}/offer`).set({sdp:offer.sdp,type:offer.type});
  db.ref(`voiceSignal/${currentServerId}/${currentVoiceChannel}/${remoteUid}/${currentUser.uid}/offer`).on('value',async snap=>{
    if(!snap.val()||pc.signalingState!=='stable')return;
    await pc.setRemoteDescription(new RTCSessionDescription(snap.val()));
    const answer=await pc.createAnswer();
    await pc.setLocalDescription(answer);
    db.ref(`voiceSignal/${currentServerId}/${currentVoiceChannel}/${currentUser.uid}/${remoteUid}/answer`).set({sdp:answer.sdp,type:answer.type});
  });
  db.ref(`voiceSignal/${currentServerId}/${currentVoiceChannel}/${remoteUid}/${currentUser.uid}/answer`).on('value',async snap=>{
    if(!snap.val()||pc.signalingState!=='have-local-offer')return;
    await pc.setRemoteDescription(new RTCSessionDescription(snap.val()));
  });
  db.ref(`voiceSignal/${currentServerId}/${currentVoiceChannel}/${remoteUid}/${currentUser.uid}/ice`).on('value',snap=>{
    if(!snap.val())return;
    Object.values(snap.val()).forEach(c=>{pc.addIceCandidate(new RTCIceCandidate(c)).catch(()=>{});});
  });
}

    } else {

      html='<div class="friends-section-title">'+(friendTab==='online'?'ONLINE':'ALL FRIENDS')+' — '+list.length+'</div>';
      list.forEach(f=>{html+=friendItemHTML(f.uid,f.name,f.online?'Online':'Offline',`<button class="friend-action-btn" onclick="openDM('${f.uid}','${f.name}','')" title="Message">💬</button><button class="friend-action-btn reject" onclick="showToast('Friend removed','success')" title="Remove">✗</button>`);});
    }
    content.innerHTML=html;
  };

  window.showFriendTab=function(tab){
    friendTab=tab;
    ['online','all','pending','add'].forEach(t=>{const btn=document.getElementById('fn-'+t);if(btn)btn.classList.toggle('active',t===tab);});
    refreshFriendsView();
  };

  window.toggleMute=function(){
    isMuted=!isMuted;
    document.getElementById('mute-btn').style.color=isMuted?'var(--red)':'';
    showToast(isMuted?'Muted':'Unmuted');
  };

  window.closeDM=function(uid){
    delete dmList[uid];
    renderDMList();
    if(currentDMUserId===uid)showHome();
  };

  showHome();
  showToast('Running in demo mode — add Firebase config for full features','warning');
}
</script>
</body>
</html>
