<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TConnect</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
--bg-primary:#313338;--bg-secondary:#2b2d31;--bg-tertiary:#1e1f22;--bg-quaternary:#232428;
--bg-hover:#35373c;--bg-active:#404249;--bg-modifier-hover:rgba(79,84,92,.16);
--bg-modifier-active:rgba(79,84,92,.32);--bg-modifier-selected:rgba(79,84,92,.48);
--text-normal:#dbdee1;--text-muted:#80848e;--text-link:#00a8fc;--text-positive:#23a55a;
--text-warning:#f0b232;--text-danger:#f23f43;--header-primary:#f2f3f5;--header-secondary:#b5bac1;
--interactive-normal:#b5bac1;--interactive-hover:#dbdee1;--interactive-active:#f2f3f5;
--interactive-muted:#41434a;--brand:#5865f2;--brand-hover:#4752c4;--brand-active:#3c45a5;
--green:#23a55a;--red:#f23f43;--yellow:#f0b232;--channel-icon:#80848e;
--input-bg:#1e1f22;--sidebar-width:240px;--server-sidebar-width:72px;
--font-primary:'Noto Sans',sans-serif;
}
body{font-family:var(--font-primary);background:var(--bg-primary);color:var(--text-normal);height:100vh;overflow:hidden;display:flex;flex-direction:column}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#1a1b1e;border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:#111}
input,textarea,select{font-family:var(--font-primary)}
button{cursor:pointer;font-family:var(--font-primary)}
a{color:var(--text-link);text-decoration:none}
a:hover{text-decoration:underline}

/* AUTH */
#auth-screen{position:fixed;inset:0;background:radial-gradient(ellipse at 60% 30%,#404796 0%,#1e1f22 60%);display:flex;align-items:center;justify-content:center;z-index:9999}
.auth-box{background:var(--bg-secondary);border-radius:8px;padding:32px;width:100%;max-width:480px;box-shadow:0 8px 16px rgba(0,0,0,.24)}
.auth-box h2{color:var(--header-primary);font-size:24px;font-weight:700;text-align:center;margin-bottom:8px}
.auth-box p.subtitle{color:var(--text-muted);text-align:center;font-size:14px;margin-bottom:20px}
.auth-logo{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:20px}
.auth-logo svg{width:40px;height:40px;fill:#5865f2}
.auth-logo span{font-size:28px;font-weight:800;color:#fff;letter-spacing:-1px}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--header-secondary);margin-bottom:8px}
.form-group input{width:100%;padding:10px;background:var(--input-bg);border:1px solid rgba(0,0,0,.3);border-radius:4px;color:var(--text-normal);font-size:16px;outline:none;transition:border-color .15s}
.form-group input:focus{border-color:var(--brand)}
.err-msg{color:var(--text-danger);font-size:12px;margin-top:4px}
.btn-primary{width:100%;padding:12px;background:var(--brand);color:#fff;font-size:16px;font-weight:500;border:none;border-radius:4px;transition:background .15s;margin-top:4px}
.btn-primary:hover{background:var(--brand-hover)}
.auth-switch{text-align:center;margin-top:16px;font-size:14px;color:var(--text-muted)}
.auth-switch a{color:var(--brand);cursor:pointer}

/* MAIN APP */
#app{display:none;flex:1;flex-direction:row;height:100vh;overflow:hidden}
#app.visible{display:flex}

/* SERVER SIDEBAR */
#server-sidebar{width:var(--server-sidebar-width);background:var(--bg-tertiary);display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:2px;overflow-y:auto;flex-shrink:0}
.server-icon{width:48px;height:48px;border-radius:50%;background:var(--bg-secondary);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:border-radius .15s,background .15s;position:relative;flex-shrink:0;overflow:hidden}
.server-icon:hover,.server-icon.active{border-radius:16px;background:var(--brand)}
.server-icon span{font-size:18px;font-weight:700;color:#fff;pointer-events:none}
.server-separator{width:32px;height:2px;background:rgba(255,255,255,.08);border-radius:1px;margin:4px 0}
.server-add-btn{width:48px;height:48px;border-radius:50%;background:var(--bg-secondary);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:border-radius .15s,background .15s;color:var(--green);font-size:24px;flex-shrink:0}
.server-add-btn:hover{border-radius:16px;background:var(--green);color:#fff}
.home-btn:not(.active){background:var(--bg-secondary)}
.home-btn:not(.active):hover{background:var(--brand);border-radius:16px}
.home-btn.active{background:var(--brand);border-radius:16px}

/* CHANNEL SIDEBAR */
#channel-sidebar{width:var(--sidebar-width);background:var(--bg-secondary);display:flex;flex-direction:column;flex-shrink:0}
.sidebar-header{padding:12px 16px;border-bottom:1px solid rgba(0,0,0,.2);font-weight:700;font-size:15px;color:var(--header-primary);min-height:48px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.channel-list{flex:1;overflow-y:auto;padding:8px 0}
.channel-category{padding:0 8px;margin-top:8px}
.channel-category-header{display:flex;align-items:center;gap:4px;padding:6px 4px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted);cursor:pointer;transition:color .15s;border-radius:4px}
.channel-category-header:hover{color:var(--text-normal)}
.channel-item{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:4px;cursor:pointer;transition:background .1s;color:var(--text-muted);font-size:15px;margin:1px 4px;position:relative}
.channel-item:hover{background:var(--bg-modifier-hover);color:var(--interactive-hover)}
.channel-item.active{background:var(--bg-modifier-selected);color:var(--interactive-active)}
.channel-item svg{flex-shrink:0;color:var(--channel-icon)}
.channel-item.active svg{color:var(--interactive-active)}
.channel-item span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.add-channel-btn{opacity:0;transition:opacity .15s;margin-left:auto;color:var(--text-muted)}
.channel-category:hover .add-channel-btn{opacity:1}
.user-panel{padding:8px;background:var(--bg-quaternary);display:flex;align-items:center;gap:8px;flex-shrink:0}
.user-panel-avatar{width:32px;height:32px;border-radius:50%;background:var(--brand);overflow:hidden;position:relative;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.user-panel-avatar .status-dot{position:absolute;bottom:-1px;right:-1px;width:10px;height:10px;border-radius:50%;border:2px solid var(--bg-quaternary)}
.status-dot.online{background:var(--green)}
.status-dot.offline{background:var(--text-muted)}
.status-dot.idle{background:var(--yellow)}
.status-dot.dnd{background:var(--red)}
.user-panel-info{flex:1;min-width:0}
.user-panel-name{font-size:13px;font-weight:600;color:var(--header-primary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.user-panel-status{font-size:11px;color:var(--text-muted)}
.user-panel-controls{display:flex;gap:2px}
.icon-btn{width:32px;height:32px;border-radius:4px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--interactive-normal);transition:color .15s,background .15s;border:none;background:transparent}
.icon-btn:hover{color:var(--interactive-hover);background:var(--bg-modifier-hover)}

/* CHAT AREA */
#chat-area{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg-primary)}
.chat-header{padding:0 16px;border-bottom:1px solid rgba(0,0,0,.2);min-height:48px;display:flex;align-items:center;gap:8px;flex-shrink:0}
.chat-header .channel-name{font-weight:700;font-size:15px;color:var(--header-primary)}
.chat-header .channel-desc{font-size:14px;color:var(--text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-header svg{color:var(--channel-icon);flex-shrink:0}
.chat-header-divider{width:1px;height:24px;background:rgba(255,255,255,.1);margin:0 4px}
.chat-messages{flex:1;overflow-y:auto;padding:16px 0;display:flex;flex-direction:column}
.msg-group{display:flex;gap:16px;padding:2px 16px;margin-bottom:4px;transition:background .1s;border-radius:4px}
.msg-group:hover{background:var(--bg-modifier-hover)}
.msg-avatar{width:40px;height:40px;border-radius:50%;flex-shrink:0;margin-top:4px;overflow:hidden;background:var(--brand);display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:16px}
.msg-content{flex:1;min-width:0}
.msg-header{display:flex;align-items:baseline;gap:8px;margin-bottom:2px}
.msg-author{font-weight:500;font-size:15px;color:var(--header-primary);cursor:pointer}
.msg-author:hover{text-decoration:underline}
.msg-time{font-size:11px;color:var(--text-muted)}
.msg-text{font-size:15px;line-height:1.375;color:var(--text-normal);word-break:break-word}
.msg-continued{display:flex;gap:16px;padding:1px 16px;transition:background .1s}
.msg-continued:hover{background:var(--bg-modifier-hover)}
.msg-continued .msg-time-small{width:40px;flex-shrink:0;font-size:10px;color:transparent;text-align:right;padding-top:2px;line-height:1.6}
.msg-continued:hover .msg-time-small{color:var(--text-muted)}
.welcome-msg{padding:16px;margin:0 16px 16px;border-top:1px solid rgba(255,255,255,.06)}
.welcome-msg h3{font-size:32px;font-weight:800;color:var(--header-primary);margin-bottom:8px}
.welcome-msg p{color:var(--text-muted);font-size:15px}
.chat-input-area{padding:0 16px 24px;flex-shrink:0}
.chat-input-wrapper{background:var(--bg-quaternary);border-radius:8px;display:flex;align-items:center;gap:8px;padding:0 16px}
.chat-input{flex:1;background:transparent;border:none;outline:none;color:var(--text-normal);font-size:15px;padding:11px 0;max-height:200px;resize:none;font-family:var(--font-primary);line-height:1.375}
.chat-input::placeholder{color:var(--text-muted)}
.chat-input-btn{color:var(--text-muted);transition:color .15s;background:none;border:none;padding:4px;border-radius:4px;display:flex;align-items:center}
.chat-input-btn:hover{color:var(--text-normal)}

/* FRIENDS PANEL */
#friends-panel{flex:1;display:flex;flex-direction:column;overflow:hidden}
.friends-header{padding:0 20px;border-bottom:1px solid rgba(0,0,0,.2);min-height:48px;display:flex;align-items:center;gap:12px;flex-shrink:0}
.friends-header svg{color:var(--text-muted);flex-shrink:0}
.friends-header span{font-weight:700;font-size:15px;color:var(--header-primary)}
.friends-nav{display:flex;gap:2px;margin-left:12px}
.friends-nav-btn{padding:4px 10px;border-radius:4px;font-size:14px;color:var(--text-muted);cursor:pointer;border:none;background:transparent;transition:background .1s,color .1s}
.friends-nav-btn:hover{background:var(--bg-modifier-hover);color:var(--text-normal)}
.friends-nav-btn.active{background:var(--bg-modifier-selected);color:var(--interactive-active)}
.friends-nav-btn.add-btn{background:var(--green);color:#fff;padding:4px 12px}
.friends-nav-btn.add-btn:hover{background:#1e8c4a}
.friends-content{flex:1;overflow-y:auto;padding:20px}
.friends-section-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted);margin-bottom:12px}
.friend-item{display:flex;align-items:center;gap:12px;padding:12px 8px;border-radius:8px;transition:background .1s;cursor:pointer}
.friend-item:hover{background:var(--bg-modifier-hover)}
.friend-avatar{width:32px;height:32px;border-radius:50%;position:relative;flex-shrink:0;overflow:hidden;background:var(--brand);display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff}
.friend-info{flex:1}
.friend-name{font-weight:600;font-size:14px;color:var(--header-primary)}
.friend-status{font-size:12px;color:var(--text-muted)}
.friend-actions{display:flex;gap:8px}
.friend-action-btn{width:32px;height:32px;border-radius:50%;background:var(--bg-secondary);border:none;color:var(--text-muted);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .15s,color .15s}
.friend-action-btn:hover{background:var(--bg-modifier-hover);color:var(--text-normal)}
.friend-action-btn.accept:hover{background:var(--green);color:#fff}
.friend-action-btn.reject:hover{background:var(--red);color:#fff}
.add-friend-box{background:var(--bg-secondary);border-radius:8px;padding:20px;margin-bottom:20px}
.add-friend-box h3{font-size:20px;font-weight:700;color:var(--header-primary);margin-bottom:4px}
.add-friend-box p{font-size:14px;color:var(--text-muted);margin-bottom:16px}
.add-friend-input-row{display:flex;gap:8px}
.add-friend-input{flex:1;background:var(--input-bg);border:1px solid rgba(0,0,0,.3);border-radius:4px;padding:10px 12px;color:var(--text-normal);font-size:14px;outline:none}
.add-friend-input:focus{border-color:var(--brand)}
.add-friend-btn{background:var(--brand);color:#fff;border:none;border-radius:4px;padding:10px 16px;font-size:14px;font-weight:500;white-space:nowrap;transition:background .15s}
.add-friend-btn:hover{background:var(--brand-hover)}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;text-align:center;color:var(--text-muted)}
.empty-state svg{margin-bottom:16px;opacity:.4}
.empty-state h3{font-size:17px;font-weight:700;color:var(--header-secondary);margin-bottom:8px}
.empty-state p{font-size:14px}

/* DM SIDEBAR */
.dm-list{flex:1;overflow-y:auto;padding:8px 0}
.dm-section-header{padding:6px 16px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted)}
.dm-item{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:4px;cursor:pointer;transition:background .1s;margin:1px 8px;position:relative}
.dm-item:hover{background:var(--bg-modifier-hover)}
.dm-item.active{background:var(--bg-modifier-selected)}
.dm-item-avatar{width:32px;height:32px;border-radius:50%;flex-shrink:0;position:relative;overflow:hidden;background:var(--brand);display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff}
.dm-item-info{flex:1;min-width:0}
.dm-item-name{font-size:14px;font-weight:500;color:var(--interactive-normal);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dm-item.active .dm-item-name,.dm-item:hover .dm-item-name{color:var(--interactive-active)}
.dm-item-preview{font-size:12px;color:var(--text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dm-item-close{opacity:0;color:var(--text-muted);margin-left:auto;background:none;border:none;font-size:14px;cursor:pointer;padding:2px 4px;border-radius:3px}
.dm-item:hover .dm-item-close{opacity:1}
.dm-item-close:hover{color:var(--text-normal)}

/* MODALS */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:1000;animation:fadeIn .1s ease}
.modal{background:var(--bg-secondary);border-radius:8px;padding:24px;width:100%;max-width:440px;box-shadow:0 8px 16px rgba(0,0,0,.24);animation:slideUp .2s ease}
.modal h2{font-size:20px;font-weight:700;color:var(--header-primary);margin-bottom:8px}
.modal p{font-size:14px;color:var(--text-muted);margin-bottom:20px}
.modal-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.btn-secondary{padding:10px 16px;background:transparent;border:none;color:var(--text-normal);font-size:14px;border-radius:4px;transition:background .15s;cursor:pointer}
.btn-secondary:hover{background:var(--bg-modifier-hover)}
.btn-danger{padding:10px 16px;background:var(--red);border:none;color:#fff;font-size:14px;border-radius:4px;cursor:pointer;transition:background .15s}
.btn-danger:hover{background:#b02b2e}
.btn-sm{padding:8px 16px;font-size:14px;border-radius:4px;border:none;color:#fff;cursor:pointer;transition:background .15s}
.btn-sm.brand{background:var(--brand)}
.btn-sm.brand:hover{background:var(--brand-hover)}

/* CONTEXT MENU */
.ctx-menu{position:fixed;background:var(--bg-tertiary);border-radius:6px;padding:6px;min-width:160px;box-shadow:0 8px 16px rgba(0,0,0,.5);z-index:2000;animation:fadeIn .1s ease}
.ctx-item{padding:8px 10px;border-radius:4px;font-size:14px;cursor:pointer;color:var(--text-normal);transition:background .1s;display:flex;align-items:center;gap:8px}
.ctx-item:hover{background:var(--brand);color:#fff}
.ctx-item.danger:hover{background:var(--red)}
.ctx-divider{height:1px;background:rgba(255,255,255,.06);margin:4px 0}

/* MEMBER LIST */
#member-list{width:240px;background:var(--bg-secondary);flex-shrink:0;display:flex;flex-direction:column;border-left:1px solid rgba(0,0,0,.2)}
.member-list-inner{flex:1;overflow-y:auto;padding:16px 8px}
.member-section-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted);padding:8px 8px 4px}
.member-item{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:4px;cursor:pointer;transition:background .1s}
.member-item:hover{background:var(--bg-modifier-hover)}
.member-avatar{width:32px;height:32px;border-radius:50%;flex-shrink:0;position:relative;overflow:hidden;background:var(--brand);display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff}
.member-name{font-size:14px;color:var(--interactive-normal);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.member-item:hover .member-name{color:var(--interactive-active)}

/* TOAST */
.toast-container{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column;gap:8px;z-index:9999}
.toast{background:var(--bg-secondary);color:var(--text-normal);padding:12px 16px;border-radius:6px;font-size:14px;box-shadow:0 4px 12px rgba(0,0,0,.4);animation:slideInRight .2s ease;border-left:4px solid var(--brand);max-width:280px}
.toast.success{border-color:var(--green)}
.toast.error{border-color:var(--red)}
.toast.warning{border-color:var(--yellow)}

/* PROFILE POPUP */
.profile-popup{position:fixed;background:var(--bg-secondary);border-radius:8px;width:280px;box-shadow:0 8px 16px rgba(0,0,0,.5);z-index:1500;overflow:hidden;animation:fadeIn .15s ease}
.profile-popup-banner{height:60px;background:linear-gradient(135deg,#5865f2,#8b5cf6)}
.profile-popup-body{padding:12px}
.profile-popup-avatar{width:72px;height:72px;border-radius:50%;border:4px solid var(--bg-secondary);margin-top:-36px;overflow:hidden;background:var(--brand);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:28px;color:#fff}
.profile-popup-name{font-size:20px;font-weight:800;color:var(--header-primary);margin-top:8px}
.profile-popup-tag{font-size:14px;color:var(--text-muted);margin-bottom:12px}
.profile-popup-divider{height:1px;background:rgba(255,255,255,.08);margin:8px 0}

.typing-indicator{padding:4px 16px;font-size:12px;color:var(--text-muted);height:24px}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes slideInRight{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}

.search-bar{background:var(--bg-tertiary);border:none;outline:none;border-radius:4px;padding:4px 8px;color:var(--text-normal);font-size:14px;width:180px}
.search-bar::placeholder{color:var(--text-muted)}

@media(max-width:768px){
  #member-list{display:none}
}
</style>
</head>
<body>

<!-- AUTH SCREEN -->
<div id="auth-screen">
<div class="auth-box">
  <div class="auth-logo">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03z"/></svg>
    <span>TConnect</span>
  </div>
  <div id="auth-login">
    <h2>Willkommen zurück!</h2>
    <p class="subtitle">Schön, dich wiederzusehen!</p>
    <div class="form-group"><label>Email <span style="color:var(--red)">*</span></label><input type="email" id="login-email" placeholder="E-Mail eingeben"></div>
    <div class="form-group"><label>Passwort <span style="color:var(--red)">*</span></label><input type="password" id="login-password" placeholder="Passwort eingeben"><div class="err-msg" id="login-err"></div></div>

<script>
// ============================================================
// LOCAL STORAGE DATABASE
// ============================================================
const DB = {
  get(key) { try { return JSON.parse(localStorage.getItem('tc_' + key)); } catch { return null; } },
  set(key, val) { localStorage.setItem('tc_' + key, JSON.stringify(val)); },
  del(key) { localStorage.removeItem('tc_' + key); }
};

// ============================================================
// STATE
// ============================================================
let currentUser = null;
let currentServerId = null;
let currentChannelId = null;
let currentDMUserId = null;
let currentView = 'home';
let friendTab = 'online';

// ============================================================
// UTILS
// ============================================================
function escapeHtml(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function capitalize(s) { return s ? s[0].toUpperCase() + s.slice(1) : s; }
function uid() { return '_' + Math.random().toString(36).substr(2, 9) + Date.now().toString(36); }
function avatarHTML(name, size = 40, bg = 'var(--brand)') {
  return `<div style="width:${size}px;height:${size}px;border-radius:50%;background:${bg};display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:${Math.floor(size*0.4)}px;flex-shrink:0">${(name||'?')[0].toUpperCase()}</div>`;
}
function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 200) + 'px';
}
function formatTime(ts) {
  const d = new Date(ts);
  return `${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;
}
function formatDateTime(ts) {
  const d = new Date(ts);
  const today = new Date();
  const isToday = d.toDateString() === today.toDateString();
  if (isToday) return `Heute um ${formatTime(ts)}`;
  return `${d.toLocaleDateString('de-DE')} um ${formatTime(ts)}`;
}

// ============================================================
// DATA HELPERS
// ============================================================
function getUsers() { return DB.get('users') || {}; }
function getUser(uid) { return getUsers()[uid] || null; }
function saveUser(uid, data) {
  const users = getUsers();
  users[uid] = { ...(users[uid]||{}), ...data };
  DB.set('users', users);
}

function getServers() { return DB.get('servers') || {}; }
function getServer(sid) { return getServers()[sid] || null; }
function saveServer(sid, data) {
  const s = getServers();
  s[sid] = { ...(s[sid]||{}), ...data };
  DB.set('servers', s);
}
function deleteServer(sid) {
  const s = getServers();
  delete s[sid];
  DB.set('servers', s);
}

function getServerMembers(sid) { return DB.get('members_' + sid) || {}; }
function addServerMember(sid, userId, role='member') {
  const m = getServerMembers(sid);
  m[userId] = { role, joinedAt: Date.now() };
  DB.set('members_' + sid, m);
}

function getUserServers(userId) { return DB.get('userservers_' + userId) || []; }
function addUserServer(userId, sid) {
  const s = getUserServers(userId);
  if (!s.includes(sid)) { s.push(sid); DB.set('userservers_' + userId, s); }
}
function removeUserServer(userId, sid) {
  const s = getUserServers(userId).filter(x => x !== sid);
  DB.set('userservers_' + userId, s);
}

function getChannels(sid) { return DB.get('channels_' + sid) || {}; }
function getChannel(sid, cid) { return getChannels(sid)[cid] || null; }
function saveChannel(sid, cid, data) {
  const c = getChannels(sid);
  c[cid] = { ...(c[cid]||{}), ...data };
  DB.set('channels_' + sid, c);
}
function deleteChannel(sid, cid) {
  const c = getChannels(sid);
  delete c[cid];
  DB.set('channels_' + sid, c);
}

function getMessages(path) { return DB.get('msgs_' + path) || []; }
function addMessage(path, msg) {
  const msgs = getMessages(path);
  msgs.push(msg);
  // Keep last 200 messages
  if (msgs.length > 200) msgs.splice(0, msgs.length - 200);
  DB.set('msgs_' + path, msgs);
  return msg;
}
function deleteMessageFromPath(path, msgId) {
  const msgs = getMessages(path).filter(m => m.id !== msgId);
  DB.set('msgs_' + path, msgs);
}

function getFriends(userId) { return DB.get('friends_' + userId) || {}; }
function addFriend(userId, friendId, friendData) {
  const f = getFriends(userId);
  f[friendId] = friendData;
  DB.set('friends_' + userId, f);
}
function removeFriend(userId, friendId) {
  const f = getFriends(userId);
  delete f[friendId];
  DB.set('friends_' + userId, f);
}

function getPending(userId) { return DB.get('pending_' + userId) || {}; }
function addPending(userId, fromId, data) {
  const p = getPending(userId);
  p[fromId] = data;
  DB.set('pending_' + userId, p);
}
function removePending(userId, fromId) {
  const p = getPending(userId);
  delete p[fromId];
  DB.set('pending_' + userId, p);
}

function getDMList(userId) { return DB.get('dmlist_' + userId) || {}; }
function saveDMEntry(userId, otherUid, data) {
  const dm = getDMList(userId);
  dm[otherUid] = { ...(dm[otherUid]||{}), ...data };
  DB.set('dmlist_' + userId, dm);
}
function removeDMEntry(userId, otherUid) {
  const dm = getDMList(userId);
  delete dm[otherUid];
  DB.set('dmlist_' + userId, dm);
}

function getDMPath(uid1, uid2) { return [uid1, uid2].sort().join('_'); }

// ============================================================
// AUTH
// ============================================================
function showLogin() {
  document.getElementById('auth-login').style.display = 'block';
  document.getElementById('auth-register').style.display = 'none';
}
function showRegister() {
  document.getElementById('auth-login').style.display = 'none';
  document.getElementById('auth-register').style.display = 'block';
}

function loginWithEmail() {
  const email = document.getElementById('login-email').value.trim();
  const pass = document.getElementById('login-password').value;
  const errEl = document.getElementById('login-err');
  errEl.textContent = '';
  if (!email || !pass) { errEl.textContent = 'Bitte alle Felder ausfüllen.'; return; }
  const users = getUsers();
  const found = Object.entries(users).find(([, u]) => u.email === email);
  if (!found) { errEl.textContent = 'E-Mail nicht gefunden.'; return; }
  const [userId, userData] = found;
  if (userData.password !== btoa(pass)) { errEl.textContent = 'Falsches Passwort.'; return; }
  DB.set('session', userId);
  currentUser = { uid: userId, ...userData };
  initApp();
}

function registerWithEmail() {
  const email = document.getElementById('reg-email').value.trim();
  const username = document.getElementById('reg-username').value.trim();
  const pass = document.getElementById('reg-password').value;
  const errEl = document.getElementById('reg-err');
  errEl.textContent = '';
  if (!email || !username || !pass) { errEl.textContent = 'Bitte alle Felder ausfüllen.'; return; }
  if (pass.length < 6) { errEl.textContent = 'Passwort muss mindestens 6 Zeichen haben.'; return; }
  const users = getUsers();
  if (Object.values(users).some(u => u.email === email)) { errEl.textContent = 'E-Mail bereits registriert.'; return; }
  if (Object.values(users).some(u => u.username === username)) { errEl.textContent = 'Benutzername bereits vergeben.'; return; }
  const userId = uid();
  const userData = { username, email, password: btoa(pass), avatar: '', status: 'online', bio: '', createdAt: Date.now() };
  saveUser(userId, userData);
  DB.set('session', userId);
  currentUser = { uid: userId, ...userData };
  initApp();
}

function logout() {
  DB.del('session');
  currentUser = null;
  currentServerId = null;
  currentChannelId = null;
  currentDMUserId = null;
  currentView = 'home';
  document.getElementById('auth-screen').style.display = 'flex';
  document.getElementById('app').classList.remove('visible');
  showLogin();
}

// Auto-login from session
window.addEventListener('DOMContentLoaded', () => {
  const sessionUid = DB.get('session');
  if (sessionUid) {
    const userData = getUser(sessionUid);
    if (userData) {
      currentUser = { uid: sessionUid, ...userData };
      initApp();
      return;
    }
  }
  document.getElementById('auth-screen').style.display = 'flex';
  // Seed demo data on first run
  if (!DB.get('seeded')) seedDemoData();
});

function seedDemoData() {
  DB.set('seeded', true);
  // Demo users
  const u1 = 'demo_alice'; const u2 = 'demo_bob';
  saveUser(u1, { username: 'Alice', email: 'alice@demo.com', password: btoa('demo123'), avatar: '', status: 'online', bio: 'Hey there! I use TConnect.', createdAt: Date.now() });
  saveUser(u2, { username: 'Bob', email: 'bob@demo.com', password: btoa('demo123'), avatar: '', status: 'online', bio: '', createdAt: Date.now() });
  // Demo server
  const sid = 'demo_server';
  saveServer(sid, { name: 'TConnect HQ', icon: '', ownerId: u1, createdAt: Date.now() });
  addUserServer(u1, sid); addUserServer(u2, sid);
  addServerMember(sid, u1, 'owner'); addServerMember(sid, u2, 'member');
  const cid1 = 'ch_general', cid2 = 'ch_announce';
  saveChannel(sid, cid1, { name: 'general', type: 'text', topic: 'Allgemeine Diskussion', createdAt: Date.now() });
  saveChannel(sid, cid2, { name: 'ankündigungen', type: 'text', topic: 'Wichtige Neuigkeiten', createdAt: Date.now() });
  addMessage('server_' + sid + '_' + cid1, { id: uid(), uid: u2, username: 'Bob', text: 'Hey! Willkommen bei TConnect 🎉', timestamp: Date.now() - 120000 });
  addMessage('server_' + sid + '_' + cid1, { id: uid(), uid: u1, username: 'Alice', text: 'Danke! Sieht super aus hier.', timestamp: Date.now() - 60000 });
  // Friends
  addFriend(u1, u2, { username: 'Bob', addedAt: Date.now() });
  addFriend(u2, u1, { username: 'Alice', addedAt: Date.now() });
  // DM
  const dmPath = getDMPath(u1, u2);
  addMessage('dm_' + dmPath, { id: uid(), uid: u2, username: 'Bob', text: 'Hey Alice! 👋', timestamp: Date.now() - 3600000 });
  saveDMEntry(u1, u2, { username: 'Bob', lastMsg: 'Hey Alice! 👋', timestamp: Date.now() - 3600000 });
  saveDMEntry(u2, u1, { username: 'Alice', lastMsg: 'Hey Alice! 👋', timestamp: Date.now() - 3600000 });
}

// ============================================================
// APP INIT
// ============================================================
function initApp() {
  document.getElementById('auth-screen').style.display = 'none';
  document.getElementById('app').classList.add('visible');
  updateUserPanel();
  renderServerList();
  renderDMList();
  showHome();
}

function currentUserData() { return getUser(currentUser.uid) || currentUser; }

function updateUserPanel() {
  const p = currentUserData();
  document.getElementById('user-panel-name').textContent = p.username || 'User';
  document.getElementById('user-panel-status-text').textContent = capitalize(p.status || 'online');
  document.getElementById('user-status-dot').className = 'status-dot ' + (p.status || 'online');
  document.getElementById('user-panel-initial').textContent = (p.username || '?')[0].toUpperCase();
}

// ============================================================
// SERVERS
// ============================================================
function renderServerList() {
  const list = document.getElementById('server-list');
  list.innerHTML = '';
  const serverIds = getUserServers(currentUser.uid);
  serverIds.forEach(sid => {
    const s = getServer(sid);
    if (!s) return;
    const el = document.createElement('div');
    el.className = 'server-icon' + (currentServerId === sid ? ' active' : '');
    el.title = s.name;
    el.onclick = () => selectServer(sid);
    el.innerHTML = `<span>${s.name[0].toUpperCase()}</span>`;
    list.appendChild(el);
  });
}

function selectServer(sid) {
  currentServerId = sid;
  currentView = 'server';
  currentDMUserId = null;
  document.getElementById('home-btn').classList.remove('active');
  renderServerList();
  const s = getServer(sid);
  if (s) document.getElementById('sidebar-title').textContent = s.name;
  document.getElementById('dm-list-area').style.display = 'none';
  document.getElementById('server-channels-area').style.display = 'block';
  document.getElementById('friends-panel').style.display = 'none';
  document.getElementById('chat-area').style.display = 'flex';
  document.getElementById('member-list').style.display = 'flex';
  loadServerChannels(sid);
}

function loadServerChannels(sid) {
  const inner = document.getElementById('channel-list-inner');
  inner.innerHTML = '';
  const chans = getChannels(sid);
  const textChans = [], voiceChans = [];
  Object.entries(chans).forEach(([cid, ch]) => {
    if (ch.type === 'voice') voiceChans.push({ ...ch, id: cid });
    else textChans.push({ ...ch, id: cid });
  });
  if (textChans.length === 0 && voiceChans.length === 0) {
    createDefaultChannels(sid);
    return;
  }
  inner.appendChild(createCategoryEl('TEXTKANÄLE', textChans, 'text', sid));
  inner.appendChild(createCategoryEl('SPRACHKANÄLE', voiceChans, 'voice', sid));
  loadServerMembers(sid);
  if (textChans.length > 0 && (!currentChannelId || !chans[currentChannelId])) {
    selectChannel(textChans[0].id);
  }
}

function createCategoryEl(name, chans, type, sid) {
  const cat = document.createElement('div');
  cat.className = 'channel-category';
  const header = document.createElement('div');
  header.className = 'channel-category-header';
  header.innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M7 10l5 5 5-5z"/></svg><span style="flex:1">${name}</span><span class="add-channel-btn" onclick="event.stopPropagation();showAddChannelModal('${type}','${sid}')"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg></span>`;
  cat.appendChild(header);
  chans.forEach(ch => {
    const item = document.createElement('div');
    item.className = 'channel-item' + (currentChannelId === ch.id ? ' active' : '');
    item.id = 'ch-' + ch.id;
    const icon = type === 'voice'
      ? `<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>`
      : `<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-2 12H6v-2h12v2zm0-3H6V9h12v2zm0-3H6V6h12v2z"/></svg>`;
    item.innerHTML = `${icon}<span>${ch.name}</span>`;
    if (type === 'voice') {
      item.onclick = () => showToast('Sprachkanäle benötigen Mikrofonzugang', 'info');
    } else {
      item.onclick = () => selectChannel(ch.id);
    }
    item.oncontextmenu = (e) => { e.preventDefault(); showChannelCtxMenu(e, ch, sid); };
    cat.appendChild(item);
  });
  return cat;
}

function createDefaultChannels(sid) {
  const cid1 = uid(), cid2 = uid();
  saveChannel(sid, cid1, { name: 'general', type: 'text', topic: 'Allgemeine Diskussion', createdAt: Date.now() });
  saveChannel(sid, cid2, { name: 'General', type: 'voice', createdAt: Date.now() });
  loadServerChannels(sid);
}

function selectChannel(cid) {
  currentChannelId = cid;
  const ch = getChannel(currentServerId, cid);
  document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
  const el = document.getElementById('ch-' + cid);
  if (el) el.classList.add('active');
  if (ch) {
    document.getElementById('chat-channel-name').textContent = ch.name;
    document.getElementById('chat-channel-desc').textContent = ch.topic || '';
    document.getElementById('chat-input').placeholder = `Nachricht #${ch.name}`;
    document.getElementById('chat-header-icon').style.display = '';
  }
  renderMessages();
}

function showAddChannelModal(type, sid) {
  showModal(`<h2>${type === 'voice' ? 'Sprachkanal' : 'Textkanal'} erstellen</h2>
<p>Erstelle einen neuen ${type === 'voice' ? 'Sprach' : 'Text'}kanal.</p>
<div class="form-group"><label>Kanalname</label><input type="text" id="new-ch-name" placeholder="${type === 'voice' ? 'Neuer Sprachkanal' : 'neuer-kanal'}"></div>`,
  [{ label: 'Erstellen', action: () => {
    const name = document.getElementById('new-ch-name').value.trim();
    if (!name) return;
    const cid = uid();
    saveChannel(sid, cid, { name, type, createdAt: Date.now() });
    closeModal();
    loadServerChannels(sid);
    showToast('Kanal erstellt!', 'success');
  }, primary: true }, { label: 'Abbrechen', action: closeModal }]);
}

function showCreateServerModal() {

// ============================================================
// MESSAGES
// ============================================================
function getMsgPath() {
  if (currentView === 'dm') return 'dm_' + getDMPath(currentUser.uid, currentDMUserId);
  return 'server_' + currentServerId + '_' + currentChannelId;
}

function renderMessages() {
  const container = document.getElementById('chat-messages');
  container.innerHTML = '';
  const ch = currentView === 'dm' ? null : (currentServerId ? getChannel(currentServerId, currentChannelId) : null);
  // Welcome
  const welcome = document.createElement('div');
  welcome.className = 'welcome-msg';
  if (currentView === 'dm') {
    const other = getUser(currentDMUserId);
    welcome.innerHTML = `<h3>Direktnachrichten mit ${escapeHtml(other?.username || 'User')}</h3><p>Nur ihr beide seid in diesem Gespräch.</p>`;
  } else {
    welcome.innerHTML = `<h3>${ch ? '#' + ch.name : ''}</h3><p>${ch && ch.topic ? escapeHtml(ch.topic) : 'Das ist der Anfang dieses Kanals. Sag Hallo!'}</p>`;
  }
  container.appendChild(welcome);
  const msgs = getMessages(getMsgPath());
  let lastUid = '', lastTime = 0;
  msgs.forEach(msg => {
    const isCont = msg.uid === lastUid && (msg.timestamp - lastTime) < 300000;
    if (isCont) {
      const cont = document.createElement('div');
      cont.className = 'msg-continued';
      cont.innerHTML = `<div class="msg-time-small">${formatTime(msg.timestamp)}</div><div class="msg-text">${escapeHtml(msg.text)}</div>`;
      cont.oncontextmenu = (e) => { e.preventDefault(); showMsgCtxMenu(e, msg); };
      container.appendChild(cont);
    } else {
      const u = getUser(msg.uid);
      const group = document.createElement('div');
      group.className = 'msg-group';
      group.innerHTML = `${avatarHTML(msg.username, 40)}
<div class="msg-content">
  <div class="msg-header">
    <span class="msg-author" onclick="showProfilePopup(event,'${msg.uid}')">${escapeHtml(msg.username || 'User')}</span>
    <span class="msg-time">${formatDateTime(msg.timestamp)}</span>
  </div>
  <div class="msg-text">${escapeHtml(msg.text)}</div>
</div>`;
      group.oncontextmenu = (e) => { e.preventDefault(); showMsgCtxMenu(e, msg); };
      container.appendChild(group);
    }
    lastUid = msg.uid; lastTime = msg.timestamp;
  });
  container.scrollTop = container.scrollHeight;
}

function sendMessage() {
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if (!text) return;
  const p = currentUserData();
  const msg = { id: uid(), uid: currentUser.uid, username: p.username || 'User', avatar: p.avatar || '', text, timestamp: Date.now() };
  addMessage(getMsgPath(), msg);
  if (currentView === 'dm') {
    const other = getUser(currentDMUserId);
    saveDMEntry(currentUser.uid, currentDMUserId, { username: other?.username || 'User', lastMsg: text, timestamp: Date.now() });
    saveDMEntry(currentDMUserId, currentUser.uid, { username: p.username || 'User', lastMsg: text, timestamp: Date.now() });
    renderDMList();
  }
  input.value = '';
  input.style.height = 'auto';
  renderMessages();
}

function handleChatKeydown(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

// ============================================================
// HOME / FRIENDS
// ============================================================
function showHome() {
  currentView = 'home';
  currentServerId = null;
  currentChannelId = null;
  currentDMUserId = null;
  document.getElementById('home-btn').classList.add('active');
  renderServerList();
  document.getElementById('dm-list-area').style.display = 'block';
  document.getElementById('server-channels-area').style.display = 'none';
  document.getElementById('friends-panel').style.display = 'flex';
  document.getElementById('chat-area').style.display = 'none';
  document.getElementById('member-list').style.display = 'none';
  document.getElementById('sidebar-title').textContent = 'Direktnachrichten';
  showFriendTab('online');
}

function showFriendTab(tab) {
  friendTab = tab;
  ['online','all','pending','add'].forEach(t => {
    const btn = document.getElementById('fn-' + t);
    if (btn) btn.classList.toggle('active', t === tab);
  });
  refreshFriendsView();
}

function refreshFriendsView() {
  const content = document.getElementById('friends-content');
  if (!content) return;
  if (friendTab === 'add') {
    content.innerHTML = `<div class="add-friend-box">
<h3>Freund hinzufügen</h3>
<p>Füge Freunde per Benutzername oder E-Mail hinzu.</p>
<div class="add-friend-input-row">
<input class="add-friend-input" id="add-friend-input" placeholder="Benutzername oder E-Mail eingeben">
<button class="add-friend-btn" onclick="sendFriendRequest()">Freundschaftsanfrage senden</button>
</div><div id="add-friend-msg" style="margin-top:8px;font-size:13px"></div></div>`;
    return;
  }
  const friends = getFriends(currentUser.uid);
  const pending = getPending(currentUser.uid);
  let html = '';
  if (friendTab === 'pending') {
    const reqs = Object.entries(pending);
    if (reqs.length === 0) {
      html = `<div class="empty-state"><svg width="64" height="64" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg><h3>Keine ausstehenden Anfragen</h3><p>Du hast keine offenen Freundschaftsanfragen.</p></div>`;
    } else {
      html = `<div class="friends-section-title">AUSSTEHEND — ${reqs.length}</div>`;
      reqs.forEach(([fuid, req]) => {
        html += friendItemHTML(fuid, req.username || 'User', 'Eingehende Anfrage',
          `<button class="friend-action-btn accept" onclick="acceptFriend('${fuid}')" title="Annehmen">✓</button>
           <button class="friend-action-btn reject" onclick="declineFriend('${fuid}')" title="Ablehnen">✗</button>`);
      });
    }
  } else {
    const list = Object.entries(friends).filter(([fuid]) => friendTab === 'all' || true);
    const label = friendTab === 'online' ? 'ONLINE' : 'ALLE FREUNDE';
    if (list.length === 0) {
      html = `<div class="empty-state"><svg width="80" height="80" viewBox="0 0 24 24" fill="currentColor"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg><h3>Keine Freunde gefunden</h3><p>Füge Freunde hinzu, um zu chatten!</p></div>`;
    } else {
      html = `<div class="friends-section-title">${label} — ${list.length}</div>`;
      list.forEach(([fuid, f]) => {
        const fUser = getUser(fuid);
        const name = fUser?.username || f.username || 'User';
        html += friendItemHTML(fuid, name, 'Offline',
          `<button class="friend-action-btn" onclick="openDM('${fuid}','${name.replace(/'/g,"\\'")}')" title="Nachricht">💬</button>
           <button class="friend-action-btn reject" onclick="doRemoveFriend('${fuid}')" title="Entfernen">✗</button>`);
      });
    }
  }
  content.innerHTML = html;
}

function friendItemHTML(fuid, name, status, actions) {
  return `<div class="friend-item">
${avatarHTML(name, 32)}
<div class="friend-info">
  <div class="friend-name">${escapeHtml(name)}</div>
  <div class="friend-status">${status}</div>
</div>
<div class="friend-actions">${actions}</div>
</div>`;
}

function sendFriendRequest() {
  const input = document.getElementById('add-friend-input');
  const val = input.value.trim();
  const msgEl = document.getElementById('add-friend-msg');
  if (!val) { msgEl.textContent = 'Bitte Benutzernamen oder E-Mail eingeben.'; msgEl.style.color = 'var(--red)'; return; }
  const users = getUsers();
  const found = Object.entries(users).find(([uid2, u]) => uid2 !== currentUser.uid && (u.email === val || u.username === val));
  if (!found) { msgEl.textContent = 'Benutzer nicht gefunden.'; msgEl.style.color = 'var(--red)'; return; }
  const [targetUid, targetUser] = found;
  const friends = getFriends(currentUser.uid);
  if (friends[targetUid]) { msgEl.textContent = 'Bereits befreundet!'; msgEl.style.color = 'var(--yellow)'; return; }
  const p = currentUserData();
  addPending(targetUid, currentUser.uid, { username: p.username || 'User', timestamp: Date.now() });
  msgEl.textContent = `Freundschaftsanfrage an ${targetUser.username} gesendet!`;
  msgEl.style.color = 'var(--green)';
  input.value = '';
}

function acceptFriend(fromUid) {
  const pending = getPending(currentUser.uid);
  const req = pending[fromUid];
  const p = currentUserData();
  const fromUser = getUser(fromUid);
  addFriend(currentUser.uid, fromUid, { username: fromUser?.username || req?.username || 'User', addedAt: Date.now() });
  addFriend(fromUid, currentUser.uid, { username: p.username || 'User', addedAt: Date.now() });
  removePending(currentUser.uid, fromUid);
  showToast('Freund hinzugefügt!', 'success');
  refreshFriendsView();
  const pendCount = Object.keys(getPending(currentUser.uid)).length;
  document.getElementById('fn-pending').textContent = pendCount > 0 ? `Ausstehend (${pendCount})` : 'Ausstehend';
}

function declineFriend(fromUid) {
  removePending(currentUser.uid, fromUid);
  refreshFriendsView();
  const pendCount = Object.keys(getPending(currentUser.uid)).length;
  document.getElementById('fn-pending').textContent = pendCount > 0 ? `Ausstehend (${pendCount})` : 'Ausstehend';
}

function doRemoveFriend(fuid) {
  removeFriend(currentUser.uid, fuid);
  removeFriend(fuid, currentUser.uid);
  showToast('Freund entfernt', 'success');
  refreshFriendsView();
}

// DIRECT MESSAGES
// ============================================================
function renderDMList() {
  const container = document.getElementById('dm-items');
  container.innerHTML = '';
  const dmList = getDMList(currentUser.uid);
  const sorted = Object.entries(dmList).sort((a, b) => (b[1].timestamp || 0) - (a[1].timestamp || 0));
  sorted.forEach(([otherUid, dm]) => {
    const other = getUser(otherUid);
    const name = other?.username || dm.username || 'User';
    const el = document.createElement('div');
    el.className = 'dm-item' + (currentDMUserId === otherUid ? ' active' : '');
    el.id = 'dm-' + otherUid;
    el.innerHTML = `${avatarHTML(name, 32)}
<div class="dm-item-info">
  <div class="dm-item-name">${escapeHtml(name)}</div>
  <div class="dm-item-preview">${escapeHtml(dm.lastMsg || '')}</div>
</div>
<button class="dm-item-close" onclick="event.stopPropagation();closeDM('${otherUid}')">✕</button>`;
    el.onclick = () => openDM(otherUid, name);
    container.appendChild(el);
  });
}

function openDM(otherUid, name) {
  currentDMUserId = otherUid;
  currentView = 'dm';
  currentServerId = null;
  currentChannelId = null;
  document.getElementById('home-btn').classList.remove('active');
  renderServerList();
  document.getElementById('dm-list-area').style.display = 'block';
  document.getElementById('server-channels-area').style.display = 'none';
  document.getElementById('friends-panel').style.display = 'none';
  document.getElementById('chat-area').style.display = 'flex';
  document.getElementById('member-list').style.display = 'none';
  document.getElementById('sidebar-title').textContent = 'Direktnachrichten';
  document.getElementById('chat-channel-name').textContent = name;
  document.getElementById('chat-channel-desc').textContent = '';
  document.getElementById('chat-input').placeholder = `Nachricht @${name}`;
  document.getElementById('chat-header-icon').style.display = 'none';
  const other = getUser(otherUid);
  const resolvedName = other?.username || name;
  saveDMEntry(currentUser.uid, otherUid, { username: resolvedName, timestamp: Date.now() });
  document.querySelectorAll('.dm-item').forEach(el => el.classList.remove('active'));
  const dmEl = document.getElementById('dm-' + otherUid);
  if (dmEl) dmEl.classList.add('active');
  renderDMList();
  renderMessages();
}

function closeDM(otherUid) {
  removeDMEntry(currentUser.uid, otherUid);
  if (currentDMUserId === otherUid) showHome();
  else renderDMList();
}

<option value="online" ${p.status==='online'?'selected':''}>🟢 Online</option>

</select></div>
<div class="form-group"><label>Neues Passwort (leer lassen = unverändert)</label><input type="password" id="set-password" placeholder="Neues Passwort"></div>`,

    const username = document.getElementById('set-username').value.trim();
    const status = document.getElementById('set-status').value;
    const newPass = document.getElementById('set-password').value;
    if (!username) { showToast('Benutzername darf nicht leer sein', 'error'); return; }

    saveUser(currentUser.uid, update);
    Object.assign(currentUser, update);
    updateUserPanel();
    closeModal();
    showToast('Profil aktualisiert!', 'success');
  }, primary: true }, { label: 'Abbrechen', action: closeModal }]);
}

// ============================================================
// PROFILE POPUP
// ============================================================
function showProfilePopup(e, targetUid) {
  e.stopPropagation();
  closeProfilePopup();
  const u = getUser(targetUid) || {};
  const isFriend = !!getFriends(currentUser.uid)[targetUid];
  const isMe = targetUid === currentUser.uid;
  const popup = document.createElement('div');
  popup.className = 'profile-popup';
  popup.id = 'profile-popup';
  popup.innerHTML = `<div class="profile-popup-banner"></div>
<div class="profile-popup-body">
<div class="profile-popup-avatar">${(u.username||'?')[0].toUpperCase()}</div>
<div class="profile-popup-name">${escapeHtml(u.username||'User')}</div>
<div class="profile-popup-tag">${escapeHtml(u.email||'')}</div>
<div class="profile-popup-divider"></div>
${u.bio ? `<div style="font-size:13px;color:var(--text-muted);margin-bottom:8px">${escapeHtml(u.bio)}</div>` : ''}
<div style="display:flex;gap:8px;margin-top:8px">
${!isMe && !isFriend ? `<button class="btn-sm brand" onclick="sendFriendReqDirect('${targetUid}','${(u.username||'').replace(/'/g,"\\'")}')">Freund hinzufügen</button>` : ''}
${!isMe ? `<button class="btn-sm brand" onclick="openDM('${targetUid}','${(u.username||'User').replace(/'/g,"\\'")}');closeProfilePopup()">Nachricht</button>` : ''}
${isMe ? `<button class="btn-sm brand" onclick="showSettings();closeProfilePopup()">Profil bearbeiten</button>` : ''}
</div></div>`;
  const rect = e.target.getBoundingClientRect();
  let left = rect.right + 8, top = rect.top;
  if (left + 280 > window.innerWidth) left = rect.left - 288;
  if (top + 300 > window.innerHeight) top = window.innerHeight - 300;
  popup.style.left = left + 'px'; popup.style.top = top + 'px';
  document.body.appendChild(popup);
  setTimeout(() => document.addEventListener('click', closeProfilePopup, { once: true }), 0);
}

function closeProfilePopup() { const p = document.getElementById('profile-popup'); if (p) p.remove(); }

function sendFriendReqDirect(targetUid, username) {
  const p = currentUserData();
  addPending(targetUid, currentUser.uid, { username: p.username || 'User', timestamp: Date.now() });
  showToast(`Freundschaftsanfrage an ${username} gesendet!`, 'success');
  closeProfilePopup();
}

// CONTEXT MENUS
// ============================================================
function showChannelCtxMenu(e, ch, sid) {
  closeCtxMenu();
  const isOwner = getServer(sid)?.ownerId === currentUser.uid;
  const menu = document.createElement('div');
  menu.className = 'ctx-menu'; menu.id = 'ctx-menu';
  menu.innerHTML = `<div class="ctx-item" onclick="renameChannelModal('${ch.id}','${escapeHtml(ch.name)}','${sid}');closeCtxMenu()">Kanal umbenennen</div>
${isOwner ? `<div class="ctx-divider"></div><div class="ctx-item danger" onclick="deleteChannelConfirm('${ch.id}','${sid}');closeCtxMenu()">Kanal löschen</div>` : ''}`;
  menu.style.left = e.clientX + 'px'; menu.style.top = e.clientY + 'px';
  document.body.appendChild(menu);
  setTimeout(() => document.addEventListener('click', closeCtxMenu, { once: true }), 0);
}

function showMsgCtxMenu(e, msg) {
  closeCtxMenu();
  const isOwn = msg.uid === currentUser.uid;
  const menu = document.createElement('div');
  menu.className = 'ctx-menu'; menu.id = 'ctx-menu';
  menu.innerHTML = `<div class="ctx-item" onclick="navigator.clipboard.writeText('${msg.text.replace(/'/g,"\\'")}').then(()=>showToast('Kopiert!'));closeCtxMenu()">Nachricht kopieren</div>
${isOwn ? `<div class="ctx-divider"></div><div class="ctx-item danger" onclick="doDeleteMessage('${msg.id}');closeCtxMenu()">Nachricht löschen</div>` : ''}`;
  menu.style.left = e.clientX + 'px'; menu.style.top = e.clientY + 'px';
  document.body.appendChild(menu);
  setTimeout(() => document.addEventListener('click', closeCtxMenu, { once: true }), 0);
}

function closeCtxMenu() { const m = document.getElementById('ctx-menu'); if (m) m.remove(); }

function renameChannelModal(cid, oldName, sid) {
  showModal(`<h2>Kanal umbenennen</h2><p>Ändere den Namen dieses Kanals.</p>
<div class="form-group"><label>Kanalname</label><input type="text" id="rename-ch-input" value="${escapeHtml(oldName)}"></div>`,
  [{ label: 'Speichern', action: () => {
    const name = document.getElementById('rename-ch-input').value.trim();
    if (!name) return;
    saveChannel(sid, cid, { name });
    closeModal();
    loadServerChannels(sid);
    showToast('Kanal umbenannt!', 'success');
  }, primary: true }, { label: 'Abbrechen', action: closeModal }]);
}

function deleteChannelConfirm(cid, sid) {
  showModal('<h2>Kanal löschen</h2><p>Bist du sicher? Diese Aktion ist unwiderruflich.</p>',
  [{ label: 'Löschen', action: () => {
    deleteChannel(sid, cid);
    if (currentChannelId === cid) { currentChannelId = null; document.getElementById('chat-messages').innerHTML = ''; }
    closeModal();
    loadServerChannels(sid);
    showToast('Kanal gelöscht', 'success');
  }, danger: true }, { label: 'Abbrechen', action: closeModal }]);
}

function doDeleteMessage(msgId) {
  deleteMessageFromPath(getMsgPath(), msgId);
  renderMessages();
}

// ============================================================
// MODALS
// ============================================================
function showModal(html, buttons) {
  closeModal();
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay'; overlay.id = 'modal-overlay';
  const modal = document.createElement('div');
  modal.className = 'modal';
  modal.innerHTML = html + '<div class="modal-footer">' + buttons.map(b =>
    `<button class="${b.danger ? 'btn-danger' : b.primary ? 'btn-sm brand' : 'btn-secondary'}" onclick="(${b.action})()">${b.label}</button>`
  ).join('') + '</div>';
  overlay.appendChild(modal);
  document.body.appendChild(overlay);
  overlay.onclick = (e) => { if (e.target === overlay) closeModal(); };
  // Focus first input
  setTimeout(() => { const inp = modal.querySelector('input'); if (inp) inp.focus(); }, 50);
}
function closeModal() { const m = document.getElementById('modal-overlay'); if (m) m.remove(); }

// ============================================================
// TOAST
// ============================================================
function showToast(msg, type = 'info') {
  const container = document.getElementById('toast-container');
  const toast = document.createElement('div');
  toast.className = 'toast ' + type;
  toast.textContent = msg;
  container.appendChild(toast);
  setTimeout(() => { toast.style.transition = 'opacity .3s'; toast.style.opacity = '0'; }, 2500);
  setTimeout(() => toast.remove(), 2800);
}
</script>
</body>
</html>
